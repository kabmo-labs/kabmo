name: Publish Plugin Packages

# Publishes `@kabmo-labs/kabmo-sdk` and `@kabmo-labs/kabmo-ui` — the packages a panel
# plugin imports — to npm.
#
# This file is a TRIGGER, not the implementation. The steps live in
# `publish-packages.yml`, which is called from here and from `release.yml` after
# the packages job — so a package release is published by the same run that cut
# it, and there is one body rather than two that drift.
#
# Deliberately separate from `publish.yml`, which ships the app. The two have
# different cadences and different blast radii: the app is published on a release
# tag and is what users install, while these packages are a library surface that
# a plugin author depends on. Folding them together would republish a library on
# every app release for no reason, and a library fix would have to wait for one.
#
# Triggered by pushing a tag `kabmo-sdk/v1.2.3` or `kabmo-ui/v1.2.3`, which must match
# the version in that package's package.json — the check inside the called
# workflow refuses the tag otherwise, so a tag can never publish a version nobody
# wrote down. This path stays because it is the documented manual release: bump
# the version in the package's package.json, push the tag, and it ships — with no
# app release involved.
#
# `workflow_dispatch` re-runs a failed publish. It is safe to re-run: the script
# skips any package already at its version, so a job that died after the first
# package finishes the second rather than failing on the first.
#
# **An app release does not republish these unless they changed.** `release.yml`
# tags `vX.Y.Z` from the app's Conventional Commits, and that tag does not match
# the patterns above — so a `feat(panels)` commit ships the app and leaves the
# library alone. That is the intended split: the packages change when their own
# version changes, not on the app's cadence. When `release.yml`'s packages job
# DOES cut a version, its own run publishes it here.
#
# Required: NPM_TOKEN — a granular access token with "Read and write" on BOTH
# @kabmo-labs packages, or an automation token, as a repository secret or on the
# `npm` environment.
on:
  push:
    tags:
      - 'kabmo-sdk/v*'
      - 'kabmo-ui/v*'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package directories, as the release workflow names them'
        required: false
        type: string
      tag:
        description: 'Tag to publish, e.g. kabmo-sdk/v2.0.0 (alternative to `packages`)'
        required: false
        type: string
      package:
        description: 'Which package to publish (used when neither of the above is given)'
        required: false
        default: both
        type: choice
        options:
          - both
          - kabmo-sdk
          - kabmo-ui

concurrency:
  # One publish per package at a time. Grouped by the package rather than by the
  # ref so a `kabmo-ui` publish cannot start while a `kabmo-sdk` one is still running —
  # `kabmo-ui` depends on `kabmo-sdk`, so their order matters.
  group: publish-plugins
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish the plugin packages
    # A tag push names the package by its tag; a dispatch names it by
    # `packages`, `tag` or `package`. Resolved inside the callee, in that order.
    uses: ./.github/workflows/publish-packages.yml
    with:
      packages: ${{ inputs.packages || '' }}
      tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}
      package: ${{ inputs.package || '' }}
    secrets: inherit
