name: label-merge-conflict

# A conflicted pull request is not reviewable, and GitHub knows which ones conflict —
# so this workflow only mirrors that answer onto a label, where it is visible in the
# pull request list instead of buried in the merge box.
#
# It is a sweep of every open pull request rather than a handler for the event that
# conflicted it: one push to `main` can conflict a dozen pull requests at once, and
# GitHub computes mergeability asynchronously, so asking once for all of them is both
# simpler and more accurate than trying to predict which event changed the answer.
#
# The sweep runs on a SCHEDULE, not on the push that caused it. A push to `main`
# raises exactly one workflow (`release.yml`), and a label mirror is not worth a
# second run on every merge — the release run is 20+ minutes and this one is 26s,
# but a push that raises two workflows is what makes the Actions list unreadable.
# A pull request's own events are still handled immediately (opened, a head push,
# reopened, ready for review) because those are the moments a reviewer is watching;
# a conflict caused by the BASE moving is labelled within four hours instead.
on:
  schedule:
    # Every four hours, off the hour so it does not queue behind other cron.
    - cron: "17 */4 * * *"
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: sync conflict label
    if: (github.repository == 'kabmo-labs/kabmo' || github.repository == 'kabmo-labs/kabmo')
    runs-on: ubuntu-latest
    steps:
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Only the scripts are needed: this job reads GitHub's mergeability verdict and
      # never touches pull request code, so nothing from a head branch is checked out.
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Ensure labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/ensure-labels.sh

      - name: Sync the conflict label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/label-merge-conflict.sh
