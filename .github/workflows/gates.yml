name: Gates

# The four gates every change is required to pass (CONTRIBUTING.md §1) plus the
# generated settings schema, as a REUSABLE workflow — so they can be a
# REQUIREMENT of a release instead of being restated inside it.
#
# `ci.yml` is the trigger: it runs this file on every pull request and on `main`.
# `release.yml`, `publish.yml` and `publish-plugins.yml` CALL it and `needs:` it,
# which is what makes the gate binding. The alternative — reading the CI run's
# conclusion over the API — races with the run it is waiting for (the release run
# starts at the same instant as the CI run, so "no run found yet" has to be
# distinguished from "no run exists"), and a release that reads a red main as a
# missing run is exactly the failure this shape prevents.
#
# A reusable workflow is called by a job, and the check a caller reports is
# `<caller job name> / <callee job name>` — measured on this repository: the
# single job `Gates` in `ci.yml` now reports `Gates / Checks`,
# `Gates / Checks (Windows)` and `Gates / Settings schema`, where it used to
# report `Gates` and `Settings schema`. That is a RENAME of the check, and it is
# safe here only because this repository's `main` ruleset requires no status
# checks (verified: its rules are `deletion` and `non_fast_forward`). A
# repository whose branch protection DID require those names would need the
# ruleset updated in the same change, or every pull request would wait forever
# on a check that no longer reports. Nothing can prevent the rename — the
# callee's job name is not configurable from the caller — so it is a fact to
# plan around, not a bug.
#
# Nothing here reads a secret, and nothing here writes to the repository: every
# step is a read of the checked-out commit. That is what makes it safe to call
# from a job whose caller holds `contents: write` for its own release steps.
on:
  workflow_call:
    inputs:
      # Which commit to gate. Empty means the caller's own commit — what
      # `ci.yml` (a pushed commit), `release.yml` (the pushed commit) and
      # `e2e.yml` (the pull request's head) all want. `publish.yml` is the one
      # caller that names a ref: a publish is dispatched with a TAG, and gating
      # it against `main`'s tip would verify a different commit than the one
      # about to reach npm.
      ref:
        description: Git ref to check out; empty means the caller's commit.
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      # `noUnusedLocals`/`noUnusedParameters` catch what `tsc --noEmit` alone does
      # not: an import, prop or destructured field a change left behind. The two are
      # separate steps so the log says which gate failed.
      - name: Typecheck without unused code
        run: bunx tsc --noEmit --noUnusedLocals --noUnusedParameters

      # The E2E layer has its own tsconfig (it runs under Playwright/Node, not
      # Bun) and is deliberately outside the root program. Typechecking it here
      # means a broken spec is caught by the cheap gate rather than by the
      # label-gated browser job — or by neither.
      - name: Typecheck the E2E layer
        run: bun run typecheck:e2e

      - name: Test
        run: bun test

      # The production build is a gate of its own: it is the artifact `serve --prod`
      # runs, and it is the one step that executes the CSS/Tailwind bundling plugin
      # rather than merely typechecking it.
      - name: Build
        env:
          NODE_ENV: production
        run: bun run build

      # The three shells' copies of the README wordmark are GENERATED from
      # `public/kabmo-wordmark.svg`. A stale copy still renders — just not the mark —
      # so this is the gate that catches a drawing edited in one place only.
      - name: Check the shells' wordmark copies
        run: bun run scripts/shell-wordmark.mjs --check

      # The shells' document-type declarations are GENERATED from
      # `release/document-types.mjs` — the macOS and iOS plist fragments, the
      # Linux `MimeType=` list, the Windows installer's `[Registry]` block and
      # the Android manifest's intent filters. Each drifts SILENTLY: the app
      # still installs, it simply stops appearing in "Open with" for a format
      # added later.
      - name: Check the shell document types
        run: bun run scripts/shell-document-types.mjs --check

      # The editor theme catalogue is GENERATED from the installed
      # `@shikijs/themes`. A stale copy still renders the picker — with colours
      # the installed package no longer ships — so a `@shikijs/themes` bump must
      # fail here rather than ship a grid of wrong swatches.
      - name: Check the editor theme catalogue
        run: bun run scripts/editor-themes.mjs --check

      # The file-size ceiling (AGENTS.md §3) is a rule about the source tree, so it is
      # checked against the tree rather than through the build.
      - name: Check the file-size ceiling
        run: |
          over="$(find src -name '*.ts' -o -name '*.tsx' | xargs wc -l | grep -v total | awk '$1>350')"
          if [ -n "$over" ]; then
            echo "::error::Files over the 350-line ceiling:"
            echo "$over"
            exit 1
          fi
          echo "No file over 350 lines."

  # ---------------------------------------------------------------------------
  # The SAME gates on Windows, because Kabmo ships a Windows CLI and the
  # repository is developed on macOS.
  #
  # This job exists because of what a macOS-only gate cannot see: the CLI's
  # path helpers, `stop`'s ownership guard and the process-tree kill all carry
  # win32 branches (three of the last five commits on `main` are Windows fixes),
  # and every one of them was written and verified on a Mac. A branch that only
  # runs on Windows is a branch the default gate never executes.
  #
  # What is covered here is deliberately the same list as `checks`, minus the
  # steps that are platform-independent or POSIX-bound by nature:
  #
  #   - `bun run lint` and the no-unused typecheck: type errors are not
  #     platform-specific, and `tsc` on a second runner buys nothing.
  #   - the build: `Bun.build` output does not vary by platform, and it is the
  #     one step that executes the Tailwind/CSS plugin (see `checks`).
  #   - the file-size ceiling: a `find | xargs | awk` pipeline, i.e. POSIX shell
  #     that does not exist on a Windows runner.
  #
  # What IS here is the unit suite, which is where the platform branches live.
  # Suites that genuinely cannot run on Windows — a PTY (`Bun.Terminal` is
  # POSIX-only), `flock(2)`, a `#!/bin/sh` stub binary, `/bin/sh` itself — skip
  # themselves through `src/test-support/platform.ts` and say so in their own
  # header, so a skip is visible in the log rather than silently absent.
  #
  # A separate JOB rather than a matrix over `checks`: the two do not run the
  # same steps, and a matrix that expressed both would need a condition on
  # almost every step — which is a gate whose coverage depends on an `if:`.
  # ---------------------------------------------------------------------------
  windows:
    name: Checks (Windows)
    runs-on: windows-latest
    # The Windows runner is markedly slower per file than the Linux one on this
    # suite, and a timeout that a slow runner trips reads as a failure of the
    # change rather than of the machine.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The suite itself. `bun test` on Windows needs no shell gymnastics: Bun
      # runs the TypeScript directly, and the POSIX-bound suites skip
      # themselves.
      - name: Test
        run: bun test

  # The settings panel is driven by a GENERATED table, so its staleness is a
  # gate rather than a review note: `bun run omp:schema:check` regenerates from
  # the installed omp and exits non-zero when the committed JSON differs. A
  # stale schema is otherwise silent — the panel simply stops offering the rows
  # upstream added (measured: 9 settings behind at 18.9.2, and the file had been
  # frozen since the Remix→Elysia migration before the generator existed).
  #
  # A separate job, not a step in `checks`: the generator imports the INSTALLED
  # `@oh-my-pi/pi-coding-agent`, which this repo does not depend on, so this job
  # must install omp first — a Bun global install is minutes on a cold runner
  # and would otherwise sit in front of every other gate.
  #
  # The pin lives in `.github/scripts/install-omp.sh` (shared with the bot
  # workflows); this job deliberately does not restate it, so the two cannot
  # disagree about which omp the schema was generated from.
  schema:
    name: Settings schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install the pinned omp
        run: bash .github/scripts/install-omp.sh

      - name: Check the settings schema is current
        run: bun run omp:schema:check
