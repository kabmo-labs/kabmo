name: Build and attach the Android APK

# The APK body, as a REUSABLE workflow — the same shape `publish-app.yml` and
# `publish-packages.yml` take, and for the same reason: the steps exist once, so
# the release run and a manual re-run cannot drift apart.
#
# TWO PHASES, and the split is the whole point of this file.
#
#   - `build` compiles and verifies the APK and uploads it as a run artifact.
#     `release.yml` calls it BEFORE `app` tags, so a build that fails (a
#     toolchain that moved, a missing keystore, a Kotlin error) stops the
#     release instead of shipping a tag whose GitHub release carries no APK.
#     That is the reported failure this shape removes: the tag and the npm
#     publish had already happened, so the only way to repair the artifact was
#     a hand-run dispatch — and the release that "went out" had no shell in it.
#   - `attach` downloads that artifact and attaches it to the GitHub release
#     `app` created. It runs after the tag, because `gh release upload` has
#     nothing to upload to before the release exists — but it no longer
#     BUILDS anything, so it cannot be the step that discovers a broken APK.
#
# Artifacts are scoped to the workflow RUN, not to a job, so the attach call
# reaches the artifact uploaded by the earlier call in the same run. That is
# what makes two calls of one body correct: the file is uploaded and downloaded
# inside one run, never found across runs. The name is a LITERAL both phases
# read — it was an input with a default, and a `workflow_dispatch` declares no
# such input, so `inputs.<name>` resolved to `''` there and a repair dispatch
# would have built an APK and attached none of it, silently.
#
# It is NOT an npm publish. The shell is a private application, so the only
# artifact is the `.apk` attached to the GitHub release. That is why there is no
# `environment: npm` here and no registry credential: the only thing the attach
# job needs is `contents: write` on the release it uploads to.
#
# The gates are NOT called here. `release.yml`'s `apk-build` job `needs:
# android`, which already depends transitively on both gate jobs — and `app`
# `needs: apk-build`, so nothing is tagged from a tree this body failed to
# build. `publish-app.yml` DOES call them, because a tag can be pushed by hand
# and nothing else would have verified it; this body is only reachable through
# `release.yml` or a manual dispatch that names an existing release.

on:
  workflow_call:
    inputs:
      # Which phase to run.
      #
      # `build` — compile, verify and upload the artifact. `release.yml`'s
      # `apk-build` job uses this, with no tag, so nothing is attached before
      # the release exists.
      #
      # `attach` — download the artifact from THIS run and upload it to
      # `tag`. `release.yml`'s `apk` job uses this after `app` tagged.
      mode:
        description: build (compile + upload artifact) or attach (upload to a release).
        required: false
        type: string
        default: build
      # The commit to build, in this order: `ref`, then `tag`, then the caller's
      # own commit.
      #
      # `release.yml` passes `main`, never the run's starting sha: the `android`
      # bump job has just pushed the shell version, and the bump is what the
      # APK's `versionName` comes from — building the trigger commit would
      # produce an APK declaring the PREVIOUS shell version, an update no
      # installed app is ever offered.
      #
      # The `tag` step in that chain is the repair path: a dispatch names an
      # existing release and builds ITS tree, so the artifact matches the
      # release it is attached to rather than whatever `main` says today.
      ref:
        description: Commit to build the APK from; empty falls back to the tag, then the caller's commit.
        required: false
        type: string
      # The release to attach to. Empty means build only.
      tag:
        description: Release tag to attach the APK to; empty builds without attaching.
        required: false
        type: string
      # Android refuses to install an APK whose versionCode is not higher than
      # the installed one, so the code must move on every release. The workflow
      # run number is monotonic per workflow and needs no state of its own.
      #
      # Typed `string`, not `number`: `github.run_number` is a STRING context
      # value, and a `number` input rejects it — actionlint reports "string value
      # cannot be assigned". The build script parses it and falls back to the
      # checked-in default when it is not a positive integer.
      #
      # Optional because `attach` does not build: it uploads a file that already
      # carries the code it was built with.
      version-code:
        description: versionCode for the APK. Must increase across releases.
        required: false
        type: string
    secrets:
      # Base64 of the release keystore (`release.jks`).
      #
      # Declared optional so the workflow PARSES, not because a missing one is
      # acceptable: the "Prepare the release keystore" step fails the job with a
      # named error instead. `required: true` would be a validation failure that
      # reads as a broken workflow, and it cannot be satisfied by the
      # `workflow_dispatch` path at all (a dispatch has no caller to pass a
      # secret, so the value comes from the repository's own secrets).
      #
      # Without it the build step FAILS rather than falling back to the debug
      # key — a debug key is generated fresh on every runner, so no APK it
      # produced could be installed over the previous one.
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  # The re-run path, which this body did not have and every other publish body
  # does. Without it a failed APK build could only be retried by re-running the
  # whole release — and when the failure is in the TOOLCHAIN (measured: the
  # `tools` package was removed from the SDK repository, so setup died before a
  # single Gradle task ran) the release itself is fine and only this artifact is
  # missing. A `workflow_dispatch` builds against an existing tag and re-attaches
  # with `--clobber`, which is exactly the repair.
  #
  # `mode` is deliberately NOT an input here: a dispatch has no earlier call in
  # its own run to have uploaded an artifact, so an attach-only dispatch would
  # have nothing to download. Every dispatch BUILDS, and attaches when it was
  # given a tag — which is exactly the repair for a release that went out with
  # no APK. `inputs` resolves for BOTH contexts, so the jobs below read
  # `inputs.tag` whichever way they were started; `secrets` are read from the
  # repository for a dispatch and from the caller for a `workflow_call`.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the APK to (e.g. v0.2.0)
        required: true
        type: string
      version-code:
        description: versionCode — must be higher than the one already published
        required: true
        type: string
      ref:
        description: Commit to build; empty builds the tag, so the repair matches its release
        required: false
        type: string

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1 — the gate. `release.yml` runs this before `app` tags.
  # ---------------------------------------------------------------------------
  build:
    name: Build the APK
    # Everything except an explicit `attach` call. Stated as "not attach" rather
    # than "== build" because a `workflow_dispatch` carries no `mode` at all,
    # and a dispatch must build — an equality test would silently skip the build
    # and leave the attach with nothing to download.
    if: ${{ inputs.mode != 'attach' }}
    runs-on: ubuntu-latest
    permissions:
      # The build reads the tree and uploads a run artifact; it needs no write
      # access to the repository.
      contents: read
    steps:
      # The commit to build, not the branch: `release.yml` names `main`, because
      # the shell bump job pushed the version the APK must declare. A manual
      # dispatch names a TAG and builds that, so a repair matches the release it
      # repairs. The `github.sha` fallback covers a caller that names neither.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.sha }}

      # AGP 8.7 requires JDK 17. The runner's default JDK is not guaranteed to
      # be 17 (it moved to 21), and a mismatch fails with a message that names
      # Gradle rather than the toolchain.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK is preinstalled on `ubuntu-latest`, but the exact
      # platform/build-tools pair this project declares is not necessarily one
      # of them — AGP downloads what it needs only when the licences are
      # accepted, and a missing licence fails the build instead of prompting.
      #
      # `packages:` is stated because the action's DEFAULT is
      # `tools platform-tools`, and `tools` was removed from the SDK repository:
      # measured on the v0.2.0 release run, the action's own install answered
      # `Warning: Failed to find package 'tools'` and `sdkmanager` exited 1, so
      # the job died in setup and no APK was ever built. The two packages this
      # project actually needs are installed by the next step.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null

      # `local.properties` is gitignored (it names a machine-local SDK path), so
      # the checkout has none. `ANDROID_HOME` is enough for AGP, but writing the
      # file makes the failure mode explicit if the SDK root ever moves.
      - name: Point Gradle at the SDK
        run: echo "sdk.dir=${ANDROID_HOME}" > packages/android/local.properties

      # The release keystore — REQUIRED, and a missing one fails the job.
      #
      # It used to fall back to the debug key with a log line, and that shipped
      # three releases (`v0.2.0`, `v0.3.0`, `v0.4.0`) each signed by a DIFFERENT
      # throwaway key, because `~/.android/debug.keystore` is regenerated on
      # every runner. Every one of those APKs was uninstallable over the last:
      # measured on an emulator, `adb install` answered
      # `INSTALL_FAILED_UPDATE_INCOMPATIBLE: Existing package dev.kabmo.shell
      # signatures do not match newer version`, and the same three signatures are
      # visible in `apksigner verify --print-certs` on the published assets. A
      # warning in a log nobody reads is not a guard: the artifact is useless, so
      # the job must stop before it builds one.
      #
      # The emptiness check is in the SHELL, not an `if:`: the `secrets` context
      # is not available in a step condition (the workflow fails to parse), and a
      # step's own `env:` is not reliably in scope for its `if:` either.
      #
      # The files are gitignored, and the cleanup step removes them so a failure
      # later in the job cannot leave signing material in an artifact.
      - name: Prepare the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to build an APK that"
            echo "::error::cannot be installed over the one already on a device — a debug key"
            echo "::error::is generated fresh on every runner, so every release would carry a"
            echo "::error::different signature. See packages/android/README.md → Signing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > packages/android/release.jks
          cat > packages/android/keystore.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/packages/android/release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build the release APK
        env:
          # The version is NOT the tag. It is `version.properties`, bumped by the
          # `android` job of `release.yml` when the shell changed — which is what
          # makes the number the console compares against the one the running app
          # reports on its User-Agent (`KabmoAndroid/<versionName>`).
          VERSION_CODE: ${{ inputs.version-code }}
        run: |
          set -euo pipefail
          cd packages/android
          # `release/android-version.mjs` is the ONE reader of that file — the
          # same `readVersionName` the bump script and its tests use. The inline
          # `sed -n 's/^versionName=//p' | sed …` this replaced was wrong twice:
          # `sed -n` with no file argument reads STDIN, so the first stage
          # consumed the pipeline and the second read nothing, and the empty
          # result only surfaced later as `versionName is not versionName=0.3.0`.
          version="$(node ../../release/android-version.mjs)"
          echo "Shell version: $version"
          ./gradlew :app:assembleRelease --no-daemon --console=plain \
            "-PkabmoVersionCode=${VERSION_CODE}"

      # The unit suite is `UrlNormalizer` only — plain JVM, no emulator — and it
      # is the one piece of the shell with real logic. Running it here rather
      # than in `gates.yml` keeps the Android toolchain out of every pull
      # request; the APK job is the only place it can pay for itself.
      - name: Unit tests
        run: |
          set -euo pipefail
          cd packages/android
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      # A version check on the artifact, not on the build file: `aapt2` reads
      # what the APK actually declares, so a missing `version.properties` read is
      # caught here instead of shipping a release whose APK cannot be installed
      # over the previous one — or, worse, one whose version does not match the
      # number the console compares against.
      - name: Verify the APK version
        env:
          VERSION_CODE: ${{ inputs.version-code }}
        run: |
          set -euo pipefail
          expected="$(node release/android-version.mjs)"
          apk=packages/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "No release APK was produced."; exit 1; }
          badging="$("$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump badging "$apk")"
          echo "$badging" | head -1
          echo "$badging" | grep -q "versionName='${expected}'" \
            || { echo "the APK declares a versionName other than ${expected}"; exit 1; }
          echo "$badging" | grep -q "versionCode='${VERSION_CODE}'" \
            || { echo "the APK declares a versionCode other than ${VERSION_CODE}"; exit 1; }

      # The signature, checked on the ARTIFACT.
      #
      # The keystore step above proves a keystore was provided; this proves the
      # APK was actually signed with it. `build.gradle.kts` picks the release
      # signingConfig only when `keystore.properties` exists, so a change to that
      # condition — or a Gradle path that ignores the file — would silently fall
      # back to the debug key and every installed app would refuse the update
      # with INSTALL_FAILED_UPDATE_INCOMPATIBLE. `apksigner verify --print-certs`
      # reads the certificate the artifact really carries, and the expected
      # fingerprint comes from the keystore itself rather than a checked-in
      # constant (a rotated key must not need this file edited).
      - name: Verify the APK signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk=packages/android/app/build/outputs/apk/release/app-release.apk
          signer="$ANDROID_HOME"/build-tools/35.0.0/apksigner
          # `keytool` prints the fingerprint UPPERCASE and `apksigner` prints it
          # lowercase, so both are folded before they are compared — otherwise
          # the check would fail on a correctly signed APK.
          expected="$("$JAVA_HOME"/bin/keytool -list -v \
            -keystore packages/android/release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          actual="$("$signer" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          echo "keystore: $expected"
          echo "apk:      $actual"
          test -n "$expected" || { echo "could not read the keystore's fingerprint"; exit 1; }
          test "$expected" = "$actual" || {
            echo "::error::the APK is not signed with the release keystore."
            echo "::error::It cannot be installed over an existing Kabmo — every release"
            echo "::error::would carry a different signature."
            exit 1
          }

      # Renamed so the download is identifiable: GitHub asset names are unique
      # per release, and `app-release.apk` says nothing about what it is.
      #
      # The name carries the SHELL's version, never the release tag — the
      # console reads the published version out of the asset name
      # (`versionFromAssetName`), so a name carrying the app's tag would compare
      # a server version against the version the running app reports and offer
      # an update that does not exist (or hide one that does). Two releases can
      # therefore carry the same asset name; they are different releases, and
      # `--clobber` only ever replaces this job's own asset.
      - name: Name the artifact
        run: |
          set -euo pipefail
          version="$(node release/android-version.mjs)"
          src=packages/android/app/build/outputs/apk/release/app-release.apk
          cp "$src" "kabmo-android-v${version}.apk"
          ls -l ./*.apk

      # The artifact is what the `attach` phase uploads — and what makes the two
      # calls one pipeline rather than two independent builds. It is the APK the
      # checks above passed, so attaching cannot substitute a different one.
      #
      # Retention is a day: the only consumer is the attach call in this same
      # run (or a dispatch's own attach), so a longer window would only clutter
      # the run's artifacts with binaries nothing reads.
      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kabmo-android-apk
          path: ./*.apk
          if-no-files-found: error
          retention-days: 1

      # Signing material never survives the job, including on failure.
      - name: Remove signing material
        if: always()
        run: |
          rm -f packages/android/keystore.properties packages/android/release.jks

  # ---------------------------------------------------------------------------
  # Phase 2 — the upload. `release.yml` runs this after `app` tagged.
  # ---------------------------------------------------------------------------
  attach:
    name: Attach the APK to the release
    needs: build
    # `always()` because a skipped `build` must not skip the attach with it: the
    # release run calls this body twice, and the second call is attach-only. The
    # result check keeps a FAILED build blocking the upload — there would be no
    # artifact to attach, and a release carrying a stale one is worse than a
    # release with none.
    if: ${{ always() && inputs.tag != '' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      # Uploading an asset to an existing release needs `contents: write`.
      contents: write
    steps:
      # The artifact from the build call in THIS run. `name` rather than a
      # pattern: there is exactly one, and a pattern that matched nothing would
      # leave an empty directory for `gh release upload` to complain about.
      - name: Download the APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kabmo-android-apk
          path: .

      # `--clobber` because a re-run of this body must replace its own asset
      # rather than fail on the duplicate. The tag is checked first: uploading to
      # a tag with no release is a confusing 404, and `release.yml` only calls
      # this after `app` cut one.
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          # `gh` resolves the repository from a git remote in the working
          # directory, and this job deliberately checks NOTHING out — its only
          # input is the artifact it just downloaded. Without this, every command
          # below died with `failed to run git: fatal: not a git repository`,
          # which the `||` guard then reported as "No GitHub release for v0.5.0"
          # — a wrong reason for a real failure, measured on run 39690728834:
          # the release existed and was empty, and the artifact was sitting in
          # the same run. Naming the repo is the fix, and it costs no checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l ./*.apk
          gh release view "$TAG" --json tagName > /dev/null \
            || { echo "No GitHub release for $TAG — the app job must run first."; exit 1; }
          gh release upload "$TAG" ./*.apk --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
