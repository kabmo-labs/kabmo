name: bot-help

# `@kabmo-bot help` is the only command answered without an agent: it prints a
# fixed list. Spending a model call on a static string would be slower and less
# reliable than the string itself.
#
# Three conventions are shared by every bot workflow here:
#   * writes use a GitHub App installation token, so comments and labels come from
#     `@kabmo-bot` rather than from `github-actions`, and a bot comment never
#     re-triggers the workflows that match bot comments;
#   * the job is skipped outside the owning repository, because a fork run has no App
#     secret and a red X there says nothing about this repository;
#   * the command must be the first line of the comment and match exactly, so prose
#     that merely mentions a command does not invoke one.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  help:
    name: help command
    if: |
      (github.repository == 'kabmo-labs/kabmo' || github.repository == 'kabmo-labs/kabmo') &&
      github.event.comment.user.type != 'Bot' &&
      (github.event.comment.body == format('@{0} help', vars.BOT_MENTION || 'kabmo-bot') ||
       startsWith(github.event.comment.body, format('@{0} help ', vars.BOT_MENTION || 'kabmo-bot')))
    runs-on: ubuntu-latest
    steps:
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Acknowledge
        id: reaction
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          reaction_id="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='eyes' \
            --jq '.id')"
          echo "id=${reaction_id}" >> "$GITHUB_OUTPUT"

      - name: Post command list
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # This job deliberately has no checkout — it only needs the API — so `gh` has no
          # git remote to infer the repository from and must be told.
          GH_REPO: ${{ github.repository }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REACTION_ID: ${{ steps.reaction.outputs.id }}
          MENTION: ${{ vars.BOT_MENTION || 'kabmo-bot' }}
        run: |
          first_line="${COMMENT_BODY%%$'\n'*}"
          case "$first_line" in
            "@${MENTION} help"|"@${MENTION} help "*) ;;
            *) echo "::error::unsupported help command: ${first_line}" >&2; exit 1 ;;
          esac

          # Unquoted heredoc so ${MENTION} expands; the body carries no backticks or $.
          gh issue comment "$ISSUE_NUMBER" --body-file - <<HELP
          <h3>kabmo bot commands</h3>

          Start a comment with one command. Any text after it is passed to the agent as maintainer focus.

          - <code>@${MENTION} review [focus]</code> — review a pull request.
          - <code>@${MENTION} summarize [focus]</code> — summarize an issue or pull request discussion.
          - <code>@${MENTION} triage [focus]</code> — triage an issue.
          - <code>@${MENTION} reproduce [focus]</code> — attempt to reproduce an issue.
          - <code>@${MENTION} help</code> — show this message.

          Automated review verdicts are advisory. They are published as one <code>review:*</code> label and never fail the pull request check, and only <code>review:ready</code> means the pull request is ready for maintainer review. Read <a href="https://github.com/kabmo-labs/kabmo/blob/main/CONTRIBUTING.md">CONTRIBUTING.md</a> before opening one.
          HELP

          if [ -n "$REACTION_ID" ]; then
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions/${REACTION_ID}" >/dev/null
          fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='+1' >/dev/null
