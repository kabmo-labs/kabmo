name: Release

# A push to `main` cuts every release this repository makes, in ONE run, in a
# fixed order: the published packages, the bundled plugin and shell version
# bumps, then the app — and each release is PUBLISHED by this same run, as its
# last action.
#
# NOTHING IS TAGGED UNTIL THE GATES AND THE BROWSER SPECS HAVE PASSED. The two
# gate jobs below CALL `.github/workflows/gates.yml` and
# `.github/workflows/e2e-specs.yml` — the same reusable workflows `ci.yml` and
# `e2e.yml` call — and `packages`/`app` `needs:` them. Re-running the commands
# inside this file would be a second copy that can drift from the gates a pull
# request runs, and reading the parallel CI run's conclusion over the API races
# with the run it is waiting for (a release run starts at the same instant as the
# CI run, so "no run yet" has to be told apart from "no run exists" — and a red
# `main` read as a missing run is exactly the failure this shape prevents).
#
# The browser layer is a RELEASE gate, not only a `main` gate: `e2e.yml` skips it
# on a pull request without the `e2e` label, so the merge that produced this
# commit may never have run a browser at all. Waiting on the parallel `e2e.yml`
# run for the same push would race it; calling the reusable workflow is a
# requirement, and a requirement cannot be won by finishing first.
#
# The order is the point, not a preference. The app does NOT ship `packages/`
# (see the `files` list in package.json) — at runtime it resolves
# `@kabmo-labs/kabmo-sdk` and `@kabmo-labs/kabmo-ui` out of its own `node_modules`,
# which is the version `bun.lock` records for those workspace packages. A
# `workspace:` spec is substituted from the LOCK, not from the manifest, so the
# app's published dependency pins are whatever the lock said when the app was
# released. Releasing the app before the packages therefore publishes stale
# pins — measured: `kabmo@4.1.1` on npm declares both packages at `1.0.0`
# while they are at `2.0.0`, and `@kabmo-labs/ui@2.0.0` declared
# `"@kabmo-labs/kabmo-sdk": "1.0.0"` while the SDK was `2.0.0`.
#
# Chaining closes it: the `packages` job bumps the versions and commits the
# refreshed `bun.lock`, and the `app` job fast-forwards to that commit before it
# releases — so the app is always built and pinned against the packages that
# were just released.
#
# The APK build sits in that chain as a GATE, between the shell bump and `app`.
# It used to run after the tag, which made a broken APK a failure discovered only
# once the release had already shipped: the tag existed, the npm publish had
# run, and the GitHub release carried no shell — repaired by a hand-run dispatch
# if anyone noticed. Now `app` `needs: apk-build`, so a toolchain that moved, a
# missing keystore or a Kotlin error stops the release before anything is
# tagged; the `apk` job after `app` only attaches the artifact the build
# uploaded, so the post-tag step cannot discover a broken APK.
#
# One run also keeps concurrency simple. Two workflows sharing a concurrency
# group is not a lock: a group is a queue that DROPS pending members as it
# grows, and sharing one across workflows let each cancel the other's releases.
# A single workflow with a single group has nothing to cancel.
#
# `publish-app.yml` and `publish-packages.yml` hold the publish BODIES, and both
# are CALLED from here as the last jobs of the run — so publishing is the last
# action of a release rather than a second run dispatched off to the side. It
# used to be a `gh workflow run` dispatch, which meant this run reported a
# successful release while the publish was still queued, still waiting on the
# `npm` environment's approval, or already failed: measured on this pipeline, an
# app release that published nothing looked exactly like one that worked. The
# dispatch is still available on those two trigger files for the cases a release
# run cannot cover — a hand-pushed tag, and a publish that failed and has to be
# re-run on its own.
#
# `publish.yml` and `publish-plugins.yml` are now the TRIGGERS for those two
# bodies: `release: published` plus `workflow_dispatch` for the app, a
# `kabmo-sdk/v*` / `kabmo-ui/v*` tag push plus `workflow_dispatch` for the packages.
# Both of them ALSO call the two gate workflows inside the body they call, so a
# publish cannot start on a commit whose gates or specs are red — whichever path
# asked for it.
#
# The release jobs repeat their setup steps rather than sharing them through
# YAML anchors. GitHub does support anchors, but an alias that carries an entire
# step into a DIFFERENT job is not a shape the documented examples cover, and
# this is a release pipeline: a parser that rejects it means no release at all,
# silently, on the push that needed one. Six short steps duplicated is the
# cheaper failure mode.
#
# The gates deliberately run BEFORE the `Sync to the current remote` step of each
# release job, so what they verified is the commit that was pushed. A sync can
# only fast-forward onto a release commit this same workflow produced, and that
# commit's own run gated its own starting point — so nothing ungated reaches the
# tag through the sync.
#
# `push` is the only trigger, which means a commit message can silently switch
# this workflow off: GitHub skips the run entirely when the message carries a
# skip marker — `[skip ci]`, `[ci skip]`, `[no ci]`, `[skip actions]`,
# `[actions skip]` — and it scans the whole message, not just the subject. The
# first release of this pipeline was swallowed that way: a commit body quoted
# the release commit's subject, marker included, so the push created no run at
# all and the release had to be triggered by hand. Only the bot's release
# commits are meant to carry a marker, and only so they do not re-trigger this
# workflow; never write one into a message you push to `main` yourself.
#
# Rehearsing locally is NOT `--dry-run` on the app pipeline: that flag still runs
# every `prepare` hook — which is where @semantic-release/git commits AND pushes
# — and semantic-release takes `repositoryUrl` from package.json's `repository`
# field in preference to the git remote, so rewriting `origin` contains nothing.
# **A rehearsal without care writes to production**: measured, a "scratch" clone
# pushed two release commits and two tags to the real repository and the branch
# had to be reverted by hand.
#
#   - packages: `node release/release-packages.mjs --dry-run` cuts nothing,
#     writes nothing and pushes nothing (the writers are not called, and
#     semantic-release's `prepare` step does not run in a dry run), and refuses
#     to run without `--dry-run` outside CI unless `KABMO_RELEASE_ALLOW_NON_CI=1`.
#   - app: drop the `@semantic-release/github` entry from release.config.mjs
#     first (that plugin publishes a real release even in dry-run mode), then
#     point the run at a throwaway repository whose URL parses — a bare
#     filesystem path fails with "Invalid URL" from the notes generator:
#       git init --bare /tmp/sr-origin.git && git push /tmp/sr-origin.git main --tags
#       node node_modules/semantic-release/bin/semantic-release.js \
#         --repository-url file:///tmp/sr-origin.git
#     The rehearsal writes the changelog with that scratch URL's links — and with
#     that URL's path parsed as the owner, so the maintainer's own commits come
#     out credited too (the credit is owner-relative, see release/contributors.js).
#     Read the result for structure, not for URLs or attribution.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, never cancelled: an interrupted run leaves a tag whose
# release commit never landed. `cancel-in-progress: false` means a queued run
# waits rather than replacing this one — and because every release now lives in
# this single workflow, there is no second group to collide with.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 0. The gates. Nothing below runs until both of these pass.
  # ---------------------------------------------------------------------------
  gates:
    name: Gates
    uses: ./.github/workflows/gates.yml

  e2e:
    name: E2E specs
    uses: ./.github/workflows/e2e-specs.yml

  # ---------------------------------------------------------------------------
  # 1. The published packages. Runs first because the app is pinned to them.
  # ---------------------------------------------------------------------------
  packages:
    name: Release the plugin packages
    needs: [gates, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      any: ${{ steps.release.outputs.any }}
      released: ${{ steps.release.outputs.released }}
    # `contents` creates the tags, the releases and the release commits.
    # `issues`/`pull-requests` are for the GitHub plugin's success hook.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Both releases derive their version from commits since a tag, so a
          # shallow clone would see no history and cut nothing.
          fetch-depth: 0
          # Keep the token in the checkout's git config: the release runner pushes
          # the one bump commit and its tags with it (`git push --atomic origin
          # HEAD:main <tags>`).
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      # semantic-release runs under Node, not Bun: it (and @semantic-release/npm,
      # which shells out to `npm version`) declares engines `^22.14 || >=24.10`,
      # and the changelog/git plugins need >= 24.15.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # semantic-release refuses to release when the local branch is behind the
      # remote — "The local branch main is behind the remote one, therefore a new
      # version won't be published." — and it exits 0 while doing it, so a
      # checkout that starts behind releases nothing and reports success.
      # Measured on this pipeline's first run: the app's release had landed first
      # and the packages run silently cut no release.
      #
      # `--ff-only` rather than a reset: a checkout that has diverged is a state
      # this workflow never intends, and it should fail loudly instead of
      # silently moving.
      - name: Sync to the current remote
        run: |
          git fetch origin main
          git merge --ff-only FETCH_HEAD
          git log --oneline -1

      # After the sync, so a lockfile the previous run committed is the one
      # installed.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Typecheck and tests are the `gates` job above, not a step here: the
      # commands are identical, and a copy that drifts is a release tagged on a
      # commit the gates never saw.
      - name: Release the packages
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release commit is attributed to the App. These four variables are
          # the only lever: this script's `git commit` runs in a child process,
          # and the workflow's own git config names whoever the checkout set up.
          # The id is the App's USER id (NOT its app id):
          # `gh api /users/kabmo-bot[bot] --jq .id`.
          GIT_AUTHOR_NAME: kabmo-bot[bot]
          GIT_AUTHOR_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: kabmo-bot[bot]
          GIT_COMMITTER_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
        # Per-package version rules and path scoping live in release/packages.mjs;
        # the version/lockfile write in release/version-package.mjs; the catalog
        # in release/packages.js. ONE commit carries every package that released
        # (release/packages-commit.js): the tags, the atomic push and the release
        # pages are that module's, and the script reports what it released in
        # GITHUB_OUTPUT because a package that released nothing must not be
        # dispatched to publish.
        run: node release/release-packages.mjs

  # The packages were TAGGED by the job above; this publishes them. It is a call
  # rather than a `gh workflow run` dispatch, which is the whole point of this
  # change: a dispatch starts a SEPARATE run, so this one used to finish — and
  # report a successful release — while the publish was still queued, still
  # waiting on the `npm` environment's approval, or already failed. Calling it
  # makes publishing the last action OF the release run.
  #
  # `ref: main` is required, not a convenience. `packages` committed the version
  # bump and the refreshed `bun.lock` to the branch, so the manifests on the
  # commit this run was triggered by still carry the OLD versions — the publish
  # script would skip every package as already published and report success
  # having published nothing. `main` resolves against the remote, so it lands on
  # the bump.
  #
  # `needs: packages` plus the `if:` is what keeps a run that released nothing
  # from calling it at all: `packages` reports `any` from its own output, because
  # a package that did not release must not be published.
  #
  # `permissions` is restated (read-only) because a calling job may set it and
  # the callee can only inherit it downgraded. The publish itself needs no
  # `contents: write`: it reads a commit and pushes to npm.
  packages-publish:
    name: Publish the released packages
    needs: packages
    if: needs.packages.outputs.any == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-packages.yml
    with:
      packages: ${{ needs.packages.outputs.released }}
      ref: main
      # This run's own `gates`/`e2e` jobs verified the starting commit, and the
      # bump commit differs from it by manifests and a lockfile only.
      run-gates: false
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 1b. The bundled marketplace plugins. Between `packages` and the shell bump,
  # and that position is the whole design.
  #
  # Named `marketplace`, NOT `plugins`: `publish-plugins.yml` already means the
  # npm packages `@kabmo-labs/kabmo-sdk` and `@kabmo-labs/kabmo-ui`, and a job called
  # `plugins` beside a workflow called "Publish Plugin Packages" reads as the
  # same thing. It is not — nothing here is published.
  # ---------------------------------------------------------------------------
  #
  # A bundled plugin is NOT published anywhere: all three are `private: true`
  # and reach a user inside the app's own tarball. The version its manifest
  # declares is the only signal `syncBundledPlugins` has — it applies the
  # store's copy only when that number is strictly NEWER — so a fix whose
  # version did not move is skipped by every existing install, forever.
  #
  # The bump must therefore be COMMITTED BEFORE the app job packs the tarball.
  # The app job fast-forwards to the commit this job makes (the same
  # `Sync to the current remote` the packages job relies on), so a bump landing
  # after it would reach installs one release late — the exact lag this removes.
  #
  # Nothing is tagged and nothing is published: the release commit is the whole
  # artifact. Measured in this repository before this job existed: the `stats`
  # sticky-header fix and the `session-info` icon fix both shipped with their
  # versions untouched.
  marketplace:
    name: Bump the marketplace plugins
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      any: ${{ steps.bump.outputs.any }}
    permissions:
      contents: write
    steps:
      # Same setup as the `packages` job, and for the same reasons: the watermark
      # is read from history, so a shallow clone would see no commits at all.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # After the sync, so the bump is computed from the commit the packages job
      # just made rather than from this run's starting point.
      - name: Sync to the current remote
        run: |
          git fetch origin main
          git merge --ff-only FETCH_HEAD
          git log --oneline -1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump the plugins
        id: bump
        # `release/marketplace.js` holds the catalog and the watermark, and
        # `release/marketplace.test.js` asserts both against the tree. The bump LEVEL
        # comes from the same `release/release-rules.js` the app and the packages
        # use, so a `fix` is a patch and a `feat` is a minor.
        run: node release/release-marketplace.mjs

      # Committed HERE, not by the app job: the app's own release commit is
      # written by semantic-release and carries only its own `assets`, so a
      # plugin bump left uncommitted would be discarded when that job resets to
      # its checkout — and the tarball would pack the OLD version.
      - name: Commit the bumps
        if: steps.bump.outputs.any == 'true'
        env:
          GIT_AUTHOR_NAME: kabmo-bot[bot]
          GIT_AUTHOR_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: kabmo-bot[bot]
          GIT_COMMITTER_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
        # The subject is a `chore`, which releases nothing on its own
        # (`release/release-rules.js`), so this commit cannot cut a version by
        # itself. `[skip ci]` because every gate already ran on the push that
        # produced it — and because a commit pushed with GITHUB_TOKEN raises no
        # workflow run anyway.
        run: |
          git add marketplace/plugins/*/package.json
          if git diff --cached --quiet; then
            echo "Nothing staged; the bump produced no change."
            exit 0
          fi
          git commit -q -m "chore(release): bump marketplace plugins (${{ steps.bump.outputs.bumped }}) [skip ci]"
          git push origin HEAD:main
          git log --oneline -1

  # ---------------------------------------------------------------------------
  # 1c. Every shell's version, in ONE job and ONE commit.
  #
  # It was five chained jobs (`android` -> `ios` -> `windows` -> `macos` ->
  # `linux`), each with its own checkout, install, bump, commit and push. The
  # chain was never a requirement: every bump reads its own watermark, its own
  # version file and its own commit range, and the five builds below only need
  # every version to be on `main`. Measured on this repository's history before
  # the change: 29 shell bump commits across six releases.
  #
  # The POSITION is unchanged and is the whole design: after `marketplace` and
  # before every shell build. `app` fast-forwards onto the commit this job makes
  # (the same `Sync to the current remote` the other bump jobs rely on), so the
  # bumped files are inside the tarball and inside every artifact built from
  # `main`. A bump landing after the app packed would reach installs one release
  # late.
  #
  # Nothing is tagged and nothing is published: every artifact is attached to the
  # app's release, so a shell bump reaches an installed app on the NEXT app
  # release — the same lag a bundled plugin bump has, and for the same reason
  # (the artifact rides the app's release rather than having one of its own).
  #
  # The runner decides EVERY shell before it writes ANY of them (see
  # `release/release-shells.mjs`), so a broken descriptor stops the run with no
  # version file touched. Where a write did land, the failing step exits 1 and
  # this job never commits — `main` gets all five files or none, which the five
  # sequential jobs could not promise.
  # ---------------------------------------------------------------------------
  shells:
    name: Bump the shell versions
    needs: marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      any: ${{ steps.bump.outputs.any }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Every watermark is read from history, so a shallow clone would see no
          # commits at all.
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # After the sync, so every range starts at the commit `marketplace` made.
      - name: Sync to the current remote
        run: |
          git fetch origin main
          git merge --ff-only FETCH_HEAD
          git log --oneline -1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump the shell versions
        id: bump
        # `release/shells.js` holds the catalog, and `release/android.js` …
        # `release/linux.js` each hold one shell's file, key and line rewriting;
        # `release/shells.test.js` asserts the catalog against the tree. The bump
        # LEVEL is the app's own rule set, so a `fix` is a patch and a `feat` a
        # minor.
        run: node release/release-shells.mjs

      # Committed HERE, not by the app job: semantic-release's release commit
      # carries only its own `assets`, so an uncommitted bump would be discarded
      # when that job resets to its checkout — and every artifact would declare
      # the OLD shell version.
      #
      # The five files are NAMED rather than staged with `-A`: a `chore` that
      # claims to be a version bump must not sweep a lockfile change into itself.
      - name: Commit the bumps
        if: steps.bump.outputs.any == 'true'
        env:
          GIT_AUTHOR_NAME: kabmo-bot[bot]
          GIT_AUTHOR_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: kabmo-bot[bot]
          GIT_COMMITTER_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
        # A `chore`, which releases nothing on its own (`release/release-rules.js`),
        # so this commit cannot cut a version by itself. `[skip ci]` because the
        # gates already ran on the push that produced it.
        run: |
          git add packages/android/version.properties \
                  packages/ios/version.properties \
                  packages/windows/version.properties \
                  packages/macos/version.properties \
                  packages/linux/version.properties
          if git diff --cached --quiet; then
            echo "Nothing staged; the bump produced no change."
            exit 0
          fi
          git commit -q -m "chore(release): bump the shells (${{ steps.bump.outputs.bumped }}) [skip ci]"
          git push origin HEAD:main
          git log --oneline -1

  # 1e. The IPA, BUILT — a GATE on the app release, for the APK's reason.
  #
  # `packages/ios` is a private application: there is no registry for it, and the
  # only artifact is the `.ipa` on the GitHub release. Building it BEFORE the tag
  # means a Swift error or an unavailable macOS runner stops `app`, so nothing is
  # tagged and nothing is published — instead of a release that goes out with no
  # shell in it, repaired only by a hand-run dispatch.
  #
  # `ref: main`, not the trigger commit: the `shells` job just pushed every shell
  # version, and the bundle must declare THAT number — building the starting
  # commit would produce an IPA declaring the previous one, which is an update no
  # installed app is ever offered.
  #
  # It does NOT gate on the shell having changed: whether `app` will tag is not
  # knowable before `app` runs, and a build that might be wasted is the price of the
  # gate. The same is true of `apk-build`.
  # ---------------------------------------------------------------------------
  ipa-build:
    name: Build the iOS IPA
    # `shells`, because every artifact compiles from a tree that carries all of
    # the shell versions — one job bumps them together, so one edge replaces the
    # old chain through `macos`.
    needs: shells
    permissions:
      # `contents: write`, and the reason is a parse-time check rather than anything
      # this job does: GitHub validates a reusable workflow's permission CEILING
      # against the whole CALLEE FILE, and `publish-ios.yml` also declares an `attach`
      # job with `contents: write`. A `read` ceiling here fails the entire release run
      # with `startup_failure` and no log — measured on the Android twin, run
      # 39681067473. `tests/ci-gates.test.ts` pins the ceiling for every
      # caller→callee pair.
      contents: write
    uses: ./.github/workflows/publish-ios.yml
    with:
      mode: build
      ref: main
      build-number: ${{ github.run_number }}

  # ---------------------------------------------------------------------------
  # 1f. The APK, BUILT — and this job is a GATE on the app release, not a
  # consequence of it.
  #
  # It used to be built after `app` tagged, which made a broken APK a failure
  # nobody noticed until the release was already out: the tag existed, the npm
  # publish had run, and the GitHub release carried no shell — repaired only by
  # a hand-run dispatch, if anyone looked. Measured: the `tools` package was
  # removed from the SDK repository and the job died in setup, so a release went
  # out with no APK at all and the console kept offering the previous one.
  #
  # Building BEFORE the tag inverts that: a toolchain that moved, a missing
  # keystore, a Kotlin error, a signature mismatch — any of them stops `app`,
  # so nothing is tagged and nothing is published. The artifact is uploaded to
  # the RUN, and the `apk` job below attaches it after `app` created the
  # release; the two calls are one pipeline because artifacts are scoped to the
  # run, so no rebuild happens between the check and the upload.
  #
  # `ref: main`, not the trigger commit: the `shells` job just pushed the shell
  # version bumps, and the APK must declare THAT version — building the
  # starting commit would produce an APK declaring the previous one, which is
  # an update no installed app is ever offered. `main` resolves against the
  # remote, so it lands on the bumps (the same reason `packages-publish` names
  # it).
  #
  # A run whose commits ask for no version bump still builds here; there is no
  # way to know whether `app` will tag before `app` runs, and a build that
  # might be wasted is the price of the gate.
  # ---------------------------------------------------------------------------
  apk-build:
    name: Build the Android APK
    # `shells`, not `android`: the bump job is one, and it pushes every shell
    # version at once. Each artifact must be built from a tree that carries all
    # of the versions, and each is a gate on `app`.
    needs: shells
    permissions:
      # `contents: write`, NOT `read`, and the reason is a parse-time check
      # rather than anything this job does. GitHub validates a reusable
      # workflow's permission CEILING against the whole CALLEE FILE before any
      # job or `if:` is considered — `publish-android.yml` also declares an
      # `attach` job with `contents: write`, so a `read` ceiling here rejected
      # the entire release run with `startup_failure` and nothing else:
      #
      #   Error calling workflow '…/publish-android.yml@<sha>'.
      #   The nested job 'attach' is requesting 'contents: write',
      #   but is only allowed 'contents: read'.
      #
      # Measured on run 39681067473: `startup_failure` after 1s, no job started,
      # no log. The `build` phase itself only reads the tree and uploads a run
      # artifact, so this grants a capability it does not use — that is the
      # price of one body covering both phases, which the repair dispatch needs
      # (a dispatch has no earlier call in its own run, so it must build AND
      # attach from one file). `tests/ci-gates.test.ts` pins the ceiling for
      # every caller→callee pair so a new write job cannot break a run silently
      # again.
      contents: write
    uses: ./.github/workflows/publish-android.yml
    with:
      mode: build
      ref: main
      version-code: ${{ github.run_number }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 1h. The Windows app, PACKAGED — a GATE on the app release, for the APK's and
  # the IPA's reason.
  #
  # Packaging BEFORE the tag means a .NET toolchain that moved, a compile error or
  # a WebView2 package that no longer restores stops `app`, so nothing is tagged
  # and nothing is published — instead of a release that goes out with no Windows
  # artifact in it.
  #
  # `ref: main`, not the trigger commit: the `shells` job just pushed the shell
  # versions, and the artifact must declare THAT number — building the starting
  # commit would produce an app reporting the previous one.
  #
  # It does NOT gate on the shell having changed: whether `app` will tag is not
  # knowable before `app` runs, and a build that might be wasted is the price of
  # the gate. The same is true of `apk-build` and `ipa-build`.
  # ---------------------------------------------------------------------------
  win-build:
    name: Build the Windows app
    # `shells` alone: every shell build reads `main` after the one bump commit, and
    # `app` names all five builds, so nothing else needs a chain here.
    needs: shells
    permissions:
      # `contents: write`, for the parse-time reason `apk-build` documents: GitHub
      # validates a reusable workflow's permission CEILING against the whole CALLEE
      # FILE, and `publish-windows.yml` also declares an `attach` job with
      # `contents: write`. A `read` ceiling here fails the entire release run with
      # `startup_failure` and no log — measured on the Android twin, run 39681067473.
      # `tests/ci-gates.test.ts` pins the ceiling for every caller→callee pair.
      contents: write
    uses: ./.github/workflows/publish-windows.yml
    with:
      mode: build
      ref: main

  # ---------------------------------------------------------------------------
  # 2. The app. Waits for the packages, the marketplace bumps, the shell bumps
  # AND every shell build, so its dependency pins are current, its tarball
  # carries the plugin versions a user needs, the tag it cuts carries the shell
  # versions its artifacts declare — and a release is never tagged when a shell
  # cannot be built.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # 1i. The macOS app, BUILT — a GATE on the app release, for the APK's reason.
  #
  # `packages/macos` is a private application: there is no registry for it, and the
  # only artifact is the `.zip` on the GitHub release. Building it BEFORE the tag
  # means a Swift error, a missing toolchain or a bundle declaring the wrong version
  # stops `app`, so nothing is tagged and nothing is published — instead of a release
  # that goes out with no app in it, repaired only by a hand-run dispatch.
  #
  # `ref: main`, not the trigger commit: the `shells` job just pushed the shell
  # versions, and the bundle must declare THAT number.
  #
  # It does NOT gate on the shell having changed: whether `app` will tag is not
  # knowable before `app` runs, and a build that might be wasted is the price of the
  # gate. The same is true of `apk-build`, `ipa-build` and `win-build`.
  # ---------------------------------------------------------------------------
  macos-build:
    name: Build the macOS app
    needs: shells
    permissions:
      # `contents: write`, for the parse-time reason `apk-build` documents: GitHub
      # validates a reusable workflow's permission CEILING against the whole CALLEE
      # FILE, and `publish-macos.yml` also declares an `attach` job with
      # `contents: write`. A `read` ceiling here fails the entire release run with
      # `startup_failure` and no log — measured on the Android twin, run 39681067473.
      # `tests/ci-gates.test.ts` pins the ceiling for every caller→callee pair.
      contents: write
    uses: ./.github/workflows/publish-macos.yml
    with:
      mode: build
      ref: main

  # The Linux app, BUILT — a gate on the app release, for the macOS/Windows reason:
  # a Rust error, a missing GTK/WebKitGTK development package or a rules-suite
  # failure must stop `app` before it tags.
  #
  # `ref: main`, not the trigger commit: the `shells` job just pushed the shell
  # versions, and `build.rs` bakes that number into the binary — building the
  # starting commit would declare the previous one.
  linux-build:
    name: Build the Linux app
    needs: shells
    permissions:
      # `contents: write` for the parse-time reason `apk-build` documents: GitHub
      # validates a reusable workflow's permission CEILING against the whole CALLEE
      # FILE, and `publish-linux.yml` also declares an `attach` job with
      # `contents: write`. A `read` ceiling here fails the whole release run with
      # `startup_failure` and no log — measured on the Android twin.
      contents: write
    uses: ./.github/workflows/publish-linux.yml
    with:
      mode: build
      ref: main

  app:
    name: Release the app
    # The five shell builds are the gate: `app` must not tag from a tree whose
    # APK, IPA, Windows app, macOS app or Linux app could not be built, and each
    # of them reads `main` after the one `shells` commit. Every build (and so
    # this job) reaches both gate workflows transitively through `shells` ->
    # `marketplace` -> `packages`.
    needs: [apk-build, ipa-build, win-build, macos-build, linux-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Same setup as the `packages` job — see the note at the top of this file
      # for why it is repeated rather than aliased.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # THIS is the step the ordering exists for. The `packages` job committed a
      # refreshed `bun.lock` carrying the new package versions, and syncing picks
      # it up BEFORE the install and the release — so the app's published
      # `@kabmo-labs/*` pins name the versions that were just released instead of
      # the previous ones.
      - name: Sync to the current remote
        run: |
          git fetch origin main
          git merge --ff-only FETCH_HEAD
          git log --oneline -1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Typecheck and tests are the gate jobs at the top of this file.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: kabmo-bot[bot]
          GIT_AUTHOR_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: kabmo-bot[bot]
          GIT_COMMITTER_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
        run: |
          # semantic-release writes no outputs, so the tag it cut is read back
          # off the repository. `releaseRules` in release/release-rules.js means
          # a push of chores/tests/docs alone bumps nothing and ends here.
          before="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          node node_modules/semantic-release/bin/semantic-release.js
          after="$(git describe --tags --abbrev=0)"
          if [ "$before" = "$after" ]; then
            echo "No release: nothing since $before asks for a version bump."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$after" >> "$GITHUB_OUTPUT"
          fi

  # The last job of the run, and now the last action of the release rather than
  # a second run dispatched beside it. `app` tagged `vX.Y.Z`; this publishes it.
  #
  # `needs: app` and the `if:` mean a run whose commits ask for no version bump
  # (`release/release-rules.js`) stops here, having published nothing — which is
  # the correct outcome for a push of chores/tests/docs alone.
  #
  # Unlike the packages call above, no `ref` is passed: the tag IS the ref to
  # publish from, and the callee resolves it from the input. The gates it runs
  # inside are pointed at that same tag, so the bytes npm receives are the bytes
  # that were verified.
  #
  # A required reviewer on the `npm` environment holds THIS run open until they
  # approve, which is intended: the release is not finished until npm has it.
  # `release.yml`'s `cancel-in-progress: false` is what keeps a queued push from
  # cancelling a run that is sitting on that approval.
  app-publish:
    name: Publish the app release
    needs: app
    if: needs.app.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-app.yml
    with:
      tag: ${{ needs.app.outputs.tag }}
      # The tag differs from the commit this run already gated by CHANGELOG.md,
      # the version field and a bundled plugin's manifest — no code. Re-running
      # the full matrix on that delta bought no coverage and cost a release:
      # v4.18.2 was tagged and never published because one unrelated test's
      # teardown flaked.
      run-gates: false
    secrets: inherit

  # 2b. Attaching the iOS shell. After `app`, for the APK's reason: `gh release
  # upload` has nothing to upload to before the release exists.
  #
  # It does NOT build. The IPA was built and verified by `ipa-build` BEFORE the tag,
  # and this call only downloads that run artifact and attaches it. `needs: app`
  # alone is enough, and the build is still a gate: `app` `needs: ipa-build`, so a
  # failed build skips `app`, and a skipped `app` leaves `released` empty and this job
  # skipped with it.
  #
  # The `versionName` the bundle declares is NOT the tag: it is
  # `packages/ios/version.properties`, which the `shells` job bumped before `ipa-build`
  # compiled it. That number is what the running shell reports on its User-Agent, and
  # the asset name carries it so `fetchShellRelease('ios')` reads the same number.
  #
  # `build-number` is not passed: the artifact was built with the run number already,
  # and re-stating it here would suggest this call could change it.
  # ---------------------------------------------------------------------------
  ipa:
    name: Attach the iOS IPA
    needs: app
    if: needs.app.outputs.released == 'true'
    # `contents: write` on the CALLER, not only the callee: a reusable workflow can
    # only DOWNGRADE the permissions it inherits, so `read` here would turn the body's
    # `contents: write` into read and the upload would fail with 403 after a full
    # build.
    permissions:
      contents: write
    uses: ./.github/workflows/publish-ios.yml
    with:
      mode: attach
      tag: ${{ needs.app.outputs.tag }}

  # ---------------------------------------------------------------------------
  # 3. Attaching the shell. After `app`, because it uploads to the release that
  # job created — `gh release upload` has nothing to upload to before that.
  #
  # It does NOT build. The APK was built and verified by `apk-build` BEFORE the
  # tag, and this call only downloads that run artifact and attaches it. That
  # split is the fix for a release going out with no shell in it: a build that
  # fails here could only be discovered after the tag and the npm publish, so
  # the artifact was missing from a release that had already shipped. A
  # packaging step cannot fail for a toolchain reason — there is no toolchain in
  # it — and the file it uploads is the exact one the checks passed.
  #
  # A call, like the two publish bodies above, so the steps exist once and a
  # re-run cannot drift from a release run. Deliberately NOT an npm publish: the
  # APK is the whole artifact and it goes to the GitHub release. Nothing is
  # tagged here either — the tag is `app`'s.
  #
  # `needs: app` (rather than naming the gates too) is what makes the gates
  # transitive: `app` -> `apk-build` -> `android` -> `marketplace` -> `packages`
  # -> both gate jobs, and `tests/ci-gates.test.ts` asserts that closure on the
  # graph.
  #
  # The `versionName` the APK declares is NOT the tag: it is
  # `packages/android/version.properties`, which the `shells` job bumped before
  # `apk-build` compiled it. That number is what the running shell reports on its
  # User-Agent, and `publish-android.yml` names the asset from the same file.
  #
  # The `if:` matches `app-publish`'s: a push whose commits ask for no version
  # bump produces no tag, so there is no release to attach an APK to.
  #
  # `version-code` is not passed: the artifact was built with the run number
  # already, and re-stating it here would suggest this call could change it.
  # ---------------------------------------------------------------------------
  apk:
    name: Attach the Android APK
    # `needs: app` alone is enough, and the build is still a gate: `app`
    # `needs: apk-build`, so a failed build skips `app`, and a skipped `app`
    # leaves `released` empty and this job skipped with it.
    needs: app
    if: needs.app.outputs.released == 'true'
    # `contents: write` on the CALLER, not only the callee: a reusable workflow
    # can only DOWNGRADE the permissions it inherits, so `read` here would turn
    # the body's `contents: write` into read and `gh release upload` would fail
    # with 403 after a full build. Unlike `app-publish` (which reads a commit
    # and pushes to npm), this job writes to the release.
    permissions:
      contents: write
    uses: ./.github/workflows/publish-android.yml
    with:
      mode: attach
      tag: ${{ needs.app.outputs.tag }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 4. Attaching the Windows app. After `app`, for the APK's reason: `gh release
  # upload` has nothing to upload to before the release exists.
  #
  # It does NOT build. The ZIP was built and verified by `win-build` BEFORE the
  # tag, and this call only downloads that run artifact and attaches it — so a
  # packaging step cannot be the step that discovers a broken app.
  #
  # The version the app declares is NOT the tag: it is
  # `packages/windows/version.properties`, which the `shells` job bumped before
  # `win-build` compiled it. `publish-windows.yml` names the asset from the same
  # file, so the number a user downloads and the number the running app reports
  # are one fact.
  #
  # The `if:` matches `app-publish`'s: a push whose commits ask for no version
  # bump produces no tag, so there is no release to attach an app to.
  # ---------------------------------------------------------------------------
  windows-app:
    name: Attach the Windows app
    needs: app
    if: needs.app.outputs.released == 'true'
    # `contents: write` on the CALLER, not only the callee: a reusable workflow can
    # only DOWNGRADE the permissions it inherits, so `read` here would turn the
    # body's `contents: write` into read and the upload would fail with 403 after a
    # full build.
    permissions:
      contents: write
    uses: ./.github/workflows/publish-windows.yml
    with:
      mode: attach
      tag: ${{ needs.app.outputs.tag }}
  # ---------------------------------------------------------------------------
  # 4b. Attaching the macOS app. After `app`, for the APK's reason: `gh release
  # upload` has nothing to upload to before the release exists.
  #
  # It does NOT build. The `.zip` was assembled and verified by `macos-build`
  # BEFORE the tag, and this call only downloads that run artifact and attaches
  # it — so a packaging step cannot be the step that discovers a broken app.
  #
  # The `versionName` the bundle declares is NOT the tag: it is
  # `packages/macos/version.properties`, which the `shells` job bumped before
  # `macos-build` compiled it. `publish-macos.yml` names the asset from the same
  # file, so the number a user downloads and the number the app reports are one
  # fact.
  #
  # The `if:` matches `app-publish`'s: a push whose commits ask for no version bump
  # produces no tag, so there is no release to attach an app to.
  # ---------------------------------------------------------------------------
  macos-app:
    name: Attach the macOS app
    needs: app
    if: needs.app.outputs.released == 'true'
    # `contents: write` on the CALLER, not only the callee: a reusable workflow can
    # only DOWNGRADE the permissions it inherits, so `read` here would turn the
    # body's `contents: write` into read and the upload would fail with 403 after a
    # full build.
    permissions:
      contents: write
    uses: ./.github/workflows/publish-macos.yml
    with:
      mode: attach
      tag: ${{ needs.app.outputs.tag }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 4d. Attaching the Linux app. After `app`, for the APK's reason: `gh release
  # upload` has nothing to upload to before the release exists.
  #
  # It does NOT build. The archive was packaged and verified by `linux-build`
  # BEFORE the tag, and this call only downloads that run artifact and attaches it
  # — so a packaging step cannot be the step that discovers a broken app.
  # ---------------------------------------------------------------------------
  linux-app:
    name: Attach the Linux app
    needs: app
    if: needs.app.outputs.released == 'true'
    # `contents: write` on the CALLER, not only the callee: a reusable workflow can
    # only DOWNGRADE the permissions it inherits, so `read` here would turn the
    # body's `contents: write` into read and the upload would fail with 403 after a
    # full build.
    permissions:
      contents: write
    uses: ./.github/workflows/publish-linux.yml
    with:
      mode: attach
      tag: ${{ needs.app.outputs.tag }}
    secrets: inherit
