name: Release

# A push to `main` cuts every release this repository makes, in ONE run, in a
# fixed order: the published packages, the bundled plugin and shell version
# bumps, then the app — and each release is PUBLISHED by this same run, as its
# last action.
#
# NOTHING IS TAGGED UNTIL THE GATES AND THE BROWSER SPECS HAVE PASSED. The two
# gate jobs below CALL `.github/workflows/gates.yml` and
# `.github/workflows/e2e-specs.yml` — the same reusable workflows `ci.yml` and
# `e2e.yml` call — and `packages`/`app` `needs:` them. Re-running the commands
# inside this file would be a second copy that can drift from the gates a pull
# request runs, and reading the parallel CI run's conclusion over the API races
# with the run it is waiting for (a release run starts at the same instant as the
# CI run, so "no run yet" has to be told apart from "no run exists" — and a red
# `main` read as a missing run is exactly the failure this shape prevents).
#
# The browser layer is a RELEASE gate, not only a `main` gate: `e2e.yml` skips it
# on a pull request without the `e2e` label, so the merge that produced this
# commit may never have run a browser at all. Waiting on the parallel `e2e.yml`
# run for the same push would race it; calling the reusable workflow is a
# requirement, and a requirement cannot be won by finishing first.
#
# The order is the point, not a preference. The app does NOT ship `packages/`
# (see the `files` list in package.json) — at runtime it resolves
# `@kabmo-labs/kabmo-sdk` and `@kabmo-labs/kabmo-ui` out of its own `node_modules`,
# which is the version `bun.lock` records for those workspace packages. A
# `workspace:` spec is substituted from the LOCK, not from the manifest, so the
# app's published dependency pins are whatever the lock said when the app was
# released. Releasing the app before the packages therefore publishes stale
# pins — measured: `kabmo@4.1.1` on npm declares both packages at `1.0.0`
# while they are at `2.0.0`, and `@kabmo-labs/ui@2.0.0` declared
# `"@kabmo-labs/kabmo-sdk": "1.0.0"` while the SDK was `2.0.0`.
#
# Chaining closes it: the `packages` job bumps the versions and commits the
# refreshed `bun.lock`, and the `app` job fast-forwards to that commit before it
# releases — so the app is always built and pinned against the packages that
# were just released.
#
# One run also keeps concurrency simple. Two workflows sharing a concurrency
# group is not a lock: a group is a queue that DROPS pending members as it
# grows, and sharing one across workflows let each cancel the other's releases.
# A single workflow with a single group has nothing to cancel.
#
# `publish-app.yml` and `publish-packages.yml` hold the publish BODIES, and both
# are CALLED from here as the last jobs of the run — so publishing is the last
# action of a release rather than a second run dispatched off to the side. It
# used to be a `gh workflow run` dispatch, which meant this run reported a
# successful release while the publish was still queued, still waiting on the
# `npm` environment's approval, or already failed: measured on this pipeline, an
# app release that published nothing looked exactly like one that worked. The
# dispatch is still available on those two trigger files for the cases a release
# run cannot cover — a hand-pushed tag, and a publish that failed and has to be
# re-run on its own.
#
# `publish.yml` and `publish-plugins.yml` are now the TRIGGERS for those two
# bodies: `release: published` plus `workflow_dispatch` for the app, a
# `kabmo-sdk/v*` / `kabmo-ui/v*` tag push plus `workflow_dispatch` for the packages.
# Both of them ALSO call the two gate workflows inside the body they call, so a
# publish cannot start on a commit whose gates or specs are red — whichever path
# asked for it.
#
# The release jobs repeat their setup steps rather than sharing them through
# YAML anchors. GitHub does support anchors, but an alias that carries an entire
# step into a DIFFERENT job is not a shape the documented examples cover, and
# this is a release pipeline: a parser that rejects it means no release at all,
# silently, on the push that needed one. Six short steps duplicated is the
# cheaper failure mode.
#
# The gates deliberately run BEFORE the `Sync to the current remote` step of each
# release job, so what they verified is the commit that was pushed. A sync can
# only fast-forward onto a release commit this same workflow produced, and that
# commit's own run gated its own starting point — so nothing ungated reaches the
# tag through the sync.
#
# `push` is the only trigger, which means a commit message can silently switch
# this workflow off: GitHub skips the run entirely when the message carries a
# skip marker — `[skip ci]`, `[ci skip]`, `[no ci]`, `[skip actions]`,
# `[actions skip]` — and it scans the whole message, not just the subject. The
# first release of this pipeline was swallowed that way: a commit body quoted
# the release commit's subject, marker included, so the push created no run at
# all and the release had to be triggered by hand. Only the bot's release
# commits are meant to carry a marker, and only so they do not re-trigger this
# workflow; never write one into a message you push to `main` yourself.
#
# Rehearsing locally is NOT `--dry-run` on the app pipeline: that flag still runs
# every `prepare` hook — which is where @semantic-release/git commits AND pushes
# — and semantic-release takes `repositoryUrl` from package.json's `repository`
# field in preference to the git remote, so rewriting `origin` contains nothing.
# **A rehearsal without care writes to production**: measured, a "scratch" clone
# pushed two release commits and two tags to the real repository and the branch
# had to be reverted by hand.
#
#   - packages: `node release/release-packages.mjs --dry-run` cuts nothing and
#     pushes nothing (it skips every `prepare` step), and refuses to run without
#     `--dry-run` outside CI unless `KABMO_RELEASE_ALLOW_NON_CI=1`.
#   - app: drop the `@semantic-release/github` entry from release.config.mjs
#     first (that plugin publishes a real release even in dry-run mode), then
#     point the run at a throwaway repository whose URL parses — a bare
#     filesystem path fails with "Invalid URL" from the notes generator:
#       git init --bare /tmp/sr-origin.git && git push /tmp/sr-origin.git main --tags
#       node node_modules/semantic-release/bin/semantic-release.js \
#         --repository-url file:///tmp/sr-origin.git
#     The rehearsal writes the changelog with that scratch URL's links — and with
#     that URL's path parsed as the owner, so the maintainer's own commits come
#     out credited too (the credit is owner-relative, see release/contributors.js).
#     Read the result for structure, not for URLs or attribution.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, never cancelled: an interrupted run leaves a tag whose
# release commit never landed. `cancel-in-progress: false` means a queued run
# waits rather than replacing this one — and because every release now lives in
# this single workflow, there is no second group to collide with.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 0. The gates. Nothing below runs until both of these pass.
  # ---------------------------------------------------------------------------
  gates:
    name: Gates
    uses: ./.github/workflows/gates.yml

  e2e:
    name: E2E specs
    uses: ./.github/workflows/e2e-specs.yml

  # ---------------------------------------------------------------------------
  # 1. The published packages. Runs first because the app is pinned to them.
  # ---------------------------------------------------------------------------
  packages:
    name: Release the plugin packages
    needs: [gates, e2e]
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.release.outputs.any }}
      released: ${{ steps.release.outputs.released }}
    # `contents` creates the tags, the releases and the release commits.
    # `issues`/`pull-requests` are for the GitHub plugin's success hook.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Both releases derive their version from commits since a tag, so a
          # shallow clone would see no history and cut nothing.
          fetch-depth: 0
          # Keep the token in the checkout's git config: @semantic-release/git
          # pushes the release commits with it.
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      # semantic-release runs under Node, not Bun: it (and @semantic-release/npm,
      # which shells out to `npm version`) declares engines `^22.14 || >=24.10`,
      # and the changelog/git plugins need >= 24.15.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # semantic-release refuses to release when the local branch is behind the
      # remote — "The local branch main is behind the remote one, therefore a new
      # version won't be published." — and it exits 0 while doing it, so a
      # checkout that starts behind releases nothing and reports success.
      # Measured on this pipeline's first run: the app's release had landed first
      # and the packages run silently cut no release.
      #
      # `--ff-only` rather than a reset: a checkout that has diverged is a state
      # this workflow never intends, and it should fail loudly instead of
      # silently moving.
      - name: Sync to the current remote
        run: |
          git fetch origin main
          git merge --ff-only FETCH_HEAD
          git log --oneline -1

      # After the sync, so a lockfile the previous run committed is the one
      # installed.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Typecheck and tests are the `gates` job above, not a step here: the
      # commands are identical, and a copy that drifts is a release tagged on a
      # commit the gates never saw.
      - name: Release the packages
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release commits are attributed to the App, not to
          # semantic-release's own default (`semantic-release-bot
          # <semantic-release-bot@martynus.net>`, see COMMIT_NAME/COMMIT_EMAIL in
          # semantic-release's constants). The library writes those into the
          # child env and then spreads the caller's env OVER them, and
          # @semantic-release/git has no author option — these four variables are
          # the only way to change it. The id is the App's USER id (NOT its app
          # id): `gh api /users/kabmo-bot[bot] --jq .id`.
          GIT_AUTHOR_NAME: kabmo-bot[bot]
          GIT_AUTHOR_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: kabmo-bot[bot]
          GIT_COMMITTER_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
        # Per-package version rules, path scoping and the lockfile refresh live
        # in release/packages.mjs, release/version-package.mjs and
        # release/packages.js. This script reports what it released in
        # GITHUB_OUTPUT, because a package that released nothing must not be
        # dispatched to publish.
        run: node release/release-packages.mjs

  # The packages were TAGGED by the job above; this publishes them. It is a call
  # rather than a `gh workflow run` dispatch, which is the whole point of this
  # change: a dispatch starts a SEPARATE run, so this one used to finish — and
  # report a successful release — while the publish was still queued, still
  # waiting on the `npm` environment's approval, or already failed. Calling it
  # makes publishing the last action OF the release run.
  #
  # `ref: main` is required, not a convenience. `packages` committed the version
  # bump and the refreshed `bun.lock` to the branch, so the manifests on the
  # commit this run was triggered by still carry the OLD versions — the publish
  # script would skip every package as already published and report success
  # having published nothing. `main` resolves against the remote, so it lands on
  # the bump.
  #
  # `needs: packages` plus the `if:` is what keeps a run that released nothing
  # from calling it at all: `packages` reports `any` from its own output, because
  # a package that did not release must not be published.
  #
  # `permissions` is restated (read-only) because a calling job may set it and
  # the callee can only inherit it downgraded. The publish itself needs no
  # `contents: write`: it reads a commit and pushes to npm.
  packages-publish:
    name: Publish the released packages
    needs: packages
    if: needs.packages.outputs.any == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-packages.yml
    with:
      packages: ${{ needs.packages.outputs.released }}
      ref: main
      # This run's own `gates`/`e2e` jobs verified the starting commit, and the
      # bump commit differs from it by manifests and a lockfile only.
      run-gates: false
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 1b. The bundled marketplace plugins. Between `packages` and the shell bump,
  # and that position is the whole design.
  #
  # Named `marketplace`, NOT `plugins`: `publish-plugins.yml` already means the
  # npm packages `@kabmo-labs/kabmo-sdk` and `@kabmo-labs/kabmo-ui`, and a job called
  # `plugins` beside a workflow called "Publish Plugin Packages" reads as the
  # same thing. It is not — nothing here is published.
  # ---------------------------------------------------------------------------
  #
  # A bundled plugin is NOT published anywhere: all three are `private: true`
  # and reach a user inside the app's own tarball. The version its manifest
  # declares is the only signal `syncBundledPlugins` has — it applies the
  # store's copy only when that number is strictly NEWER — so a fix whose
  # version did not move is skipped by every existing install, forever.
  #
  # The bump must therefore be COMMITTED BEFORE the app job packs the tarball.
  # The app job fast-forwards to the commit this job makes (the same
  # `Sync to the current remote` the packages job relies on), so a bump landing
  # after it would reach installs one release late — the exact lag this removes.
  #
  # Nothing is tagged and nothing is published: the release commit is the whole
  # artifact. Measured in this repository before this job existed: the `stats`
  # sticky-header fix and the `session-info` icon fix both shipped with their
  # versions untouched.
  marketplace:
    name: Bump the marketplace plugins
    needs: packages
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      any: ${{ steps.bump.outputs.any }}
    permissions:
      contents: write
    steps:
      # Same setup as the `packages` job, and for the same reasons: the watermark
      # is read from history, so a shallow clone would see no commits at all.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # After the sync, so the bump is computed from the commit the packages job
      # just made rather than from this run's starting point.
      - name: Sync to the current remote
        run: |
          git fetch origin main
          git merge --ff-only FETCH_HEAD
          git log --oneline -1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump the plugins
        id: bump
        # `release/marketplace.js` holds the catalog and the watermark, and
        # `release/marketplace.test.js` asserts both against the tree. The bump LEVEL
        # comes from the same `release/release-rules.js` the app and the packages
        # use, so a `fix` is a patch and a `feat` is a minor.
        run: node release/release-marketplace.mjs

      # Committed HERE, not by the app job: the app's own release commit is
      # written by semantic-release and carries only its own `assets`, so a
      # plugin bump left uncommitted would be discarded when that job resets to
      # its checkout — and the tarball would pack the OLD version.
      - name: Commit the bumps
        if: steps.bump.outputs.any == 'true'
        env:
          GIT_AUTHOR_NAME: kabmo-bot[bot]
          GIT_AUTHOR_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: kabmo-bot[bot]
          GIT_COMMITTER_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
        # The subject is a `chore`, which releases nothing on its own
        # (`release/release-rules.js`), so this commit cannot cut a version by
        # itself. `[skip ci]` because every gate already ran on the push that
        # produced it — and because a commit pushed with GITHUB_TOKEN raises no
        # workflow run anyway.
        run: |
          git add marketplace/plugins/*/package.json
          if git diff --cached --quiet; then
            echo "Nothing staged; the bump produced no change."
            exit 0
          fi
          git commit -q -m "chore(release): bump marketplace plugins (${{ steps.bump.outputs.bumped }}) [skip ci]"
          git push origin HEAD:main
          git log --oneline -1

  # ---------------------------------------------------------------------------
  # 1c. The Android shell's version. Between `marketplace` and `app`, for the
  # same reason the plugins sit there: the app job fast-forwards to the commit
  # this job makes, and the APK is built from the tag `app` cuts — so a bump
  # landing after it would reach installs one release late.
  #
  # The APK's `versionName` used to be the app's release tag, which tied two
  # independent cadences together: a shell-only fix shipped under a server
  # version, and the number the console compares (`KabmoAndroid/<versionName>`
  # against the published asset's name) said nothing about whether the shell had
  # changed. `packages/android/version.properties` now holds it, and this job is
  # the only writer.
  #
  # Nothing is tagged and nothing is published: the APK is attached to the
  # app's release, so a shell bump reaches an installed app on the NEXT app
  # release — the same lag a bundled plugin bump has, and for the same reason
  # (the artifact rides the app's release rather than having one of its own).
  # ---------------------------------------------------------------------------
  android:
    name: Bump the Android shell
    needs: marketplace
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      any: ${{ steps.bump.outputs.any }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # After the sync, so the range starts at the commit `marketplace` made.
      - name: Sync to the current remote
        run: |
          git fetch origin main
          git merge --ff-only FETCH_HEAD
          git log --oneline -1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump the shell version
        id: bump
        # `release/android.js` holds the file and the watermark pattern, and
        # `release/android.test.js` asserts them against the tree. The bump LEVEL
        # is the app's own rule set, so a `fix` is a patch and a `feat` a minor.
        run: node release/release-android.mjs

      # Committed HERE, not by the app job: semantic-release's release commit
      # carries only its own `assets`, so an uncommitted bump would be discarded
      # when that job resets to its checkout — and the tag would build the OLD
      # shell version.
      - name: Commit the bump
        if: steps.bump.outputs.any == 'true'
        env:
          GIT_AUTHOR_NAME: kabmo-bot[bot]
          GIT_AUTHOR_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: kabmo-bot[bot]
          GIT_COMMITTER_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
        # A `chore`, which releases nothing on its own (`release/release-rules.js`),
        # so this commit cannot cut a version by itself. `[skip ci]` because the
        # gates already ran on the push that produced it.
        run: |
          git add packages/android/version.properties
          if git diff --cached --quiet; then
            echo "Nothing staged; the bump produced no change."
            exit 0
          fi
          git commit -q -m "chore(release): bump the android shell (${{ steps.bump.outputs.bumped }}) [skip ci]"
          git push origin HEAD:main
          git log --oneline -1

  # ---------------------------------------------------------------------------
  # 2. The app. Waits for the packages, the marketplace bumps AND the shell
  # bump, so its dependency pins are current, its tarball carries the plugin
  # versions a user needs, and the tag it cuts carries the shell version the APK
  # will declare.
  # ---------------------------------------------------------------------------
  app:
    name: Release the app
    # `android` already `needs: marketplace`, which already `needs: packages`,
    # which already `needs:` both gate jobs — so naming `android` is what makes
    # the app wait for everything.
    needs: android
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Same setup as the `packages` job — see the note at the top of this file
      # for why it is repeated rather than aliased.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # THIS is the step the ordering exists for. The `packages` job committed a
      # refreshed `bun.lock` carrying the new package versions, and syncing picks
      # it up BEFORE the install and the release — so the app's published
      # `@kabmo-labs/*` pins name the versions that were just released instead of
      # the previous ones.
      - name: Sync to the current remote
        run: |
          git fetch origin main
          git merge --ff-only FETCH_HEAD
          git log --oneline -1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Typecheck and tests are the gate jobs at the top of this file.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: kabmo-bot[bot]
          GIT_AUTHOR_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: kabmo-bot[bot]
          GIT_COMMITTER_EMAIL: 344710581+kabmo-bot[bot]@users.noreply.github.com
        run: |
          # semantic-release writes no outputs, so the tag it cut is read back
          # off the repository. `releaseRules` in release/release-rules.js means
          # a push of chores/tests/docs alone bumps nothing and ends here.
          before="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          node node_modules/semantic-release/bin/semantic-release.js
          after="$(git describe --tags --abbrev=0)"
          if [ "$before" = "$after" ]; then
            echo "No release: nothing since $before asks for a version bump."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$after" >> "$GITHUB_OUTPUT"
          fi

  # The last job of the run, and now the last action of the release rather than
  # a second run dispatched beside it. `app` tagged `vX.Y.Z`; this publishes it.
  #
  # `needs: app` and the `if:` mean a run whose commits ask for no version bump
  # (`release/release-rules.js`) stops here, having published nothing — which is
  # the correct outcome for a push of chores/tests/docs alone.
  #
  # Unlike the packages call above, no `ref` is passed: the tag IS the ref to
  # publish from, and the callee resolves it from the input. The gates it runs
  # inside are pointed at that same tag, so the bytes npm receives are the bytes
  # that were verified.
  #
  # A required reviewer on the `npm` environment holds THIS run open until they
  # approve, which is intended: the release is not finished until npm has it.
  # `release.yml`'s `cancel-in-progress: false` is what keeps a queued push from
  # cancelling a run that is sitting on that approval.
  app-publish:
    name: Publish the app release
    needs: app
    if: needs.app.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-app.yml
    with:
      tag: ${{ needs.app.outputs.tag }}
      # The tag differs from the commit this run already gated by CHANGELOG.md,
      # the version field and a bundled plugin's manifest — no code. Re-running
      # the full matrix on that delta bought no coverage and cost a release:
      # v4.18.2 was tagged and never published because one unrelated test's
      # teardown flaked.
      run-gates: false
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 3. The Android shell. After `app`, because it ATTACHES to the release that
  # job created — `gh release upload` has nothing to upload to before that.
  #
  # A call, like the two publish bodies above, so the steps exist once and a
  # re-run cannot drift from a release run. Deliberately NOT an npm publish: the
  # APK is the whole artifact and it goes to the GitHub release. Nothing is
  # tagged here either — the tag is `app`'s.
  #
  # `needs: app` (rather than naming the gates too) is what makes the gates
  # transitive: `app` -> `android` -> `marketplace` -> `packages` -> both gate
  # jobs, and `tests/ci-gates.test.ts` asserts that closure on the graph.
  #
  # The `versionName` the APK declares is NOT the tag: it is
  # `packages/android/version.properties`, which the `android` job bumped before
  # `app` tagged. That number is what the running shell reports on its
  # User-Agent, and `publish-android.yml` names the asset from the same file.
  #
  # The `if:` matches `app-publish`'s: a push whose commits ask for no version
  # bump produces no tag, so there is no release to attach an APK to.
  #
  # `version-code` is the run number. Android refuses an install whose
  # `versionCode` is not higher than the installed one, so a fixed value would
  # make every release after the first uninstallable over the previous one.
  # ---------------------------------------------------------------------------
  apk:
    name: Publish the Android APK
    needs: app
    if: needs.app.outputs.released == 'true'
    # `contents: write` on the CALLER, not only the callee: a reusable workflow
    # can only DOWNGRADE the permissions it inherits, so `read` here would turn
    # the body's `contents: write` into read and `gh release upload` would fail
    # with 403 after a full build. Unlike `app-publish` (which reads a commit
    # and pushes to npm), this job writes to the release.
    permissions:
      contents: write
    uses: ./.github/workflows/publish-android.yml
    with:
      tag: ${{ needs.app.outputs.tag }}
      version-code: ${{ github.run_number }}
    secrets: inherit
