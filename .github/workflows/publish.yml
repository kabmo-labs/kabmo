name: Publish

# Publishing the APP is driven by GitHub releases, never by a push:
# `v0.3.0` tag + release published -> the exact tag is built and published to npm.
# `workflow_dispatch` re-runs a failed publish without recreating the release.
#
# This file is a TRIGGER, not the implementation. The steps live in
# `publish-app.yml`, which is called from here and — since publishing moved into
# the release run — from `release.yml` as the last job of a release. Two callers,
# one body, so neither can drift from the other and the gate requirement is
# stated once.
#
# `release.yml` is now the normal path: the run that cut the tag is the run that
# publishes it, and it is not finished until npm has the bytes. What remains
# HERE is the two cases a release run cannot cover:
#
#   - A tag pushed by hand, or a release published from a commit that never went
#     through `release.yml`. Nothing else would have built it.
#   - A publish that FAILED. The release run already finished, so a re-run has
#     to be its own run.
#
# Both of those are why this file still exists rather than being deleted with the
# dispatch it used to be triggered by.
#
# Required: NPM_TOKEN — a granular access token with "Read and write" permission
# on the kabmo package (or an automation token), as a repository secret or
# on the `npm` environment. Bun reads it from NPM_CONFIG_TOKEN, so the token
# never lands in a file.
#
# The published tarball is the runnable app, not a bundle: `src/**` (Bun executes
# the TypeScript directly), `dist/client` (the bundle the SSR shell reads) and
# `tsconfig.json` (Bun resolves the `@/` alias from the package's own tsconfig).
# See the `files` field in package.json. `dist/` is gitignored, so the build step
# inside `publish-app.yml` is what puts it in the tarball.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (defaults to the release tag, then the branch)
        required: false
        type: string

# Never cancel a publish mid-flight; the per-ref group keeps one release per tag
# at a time.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish the app
    # The gates, the browser specs, the build and the tarball check all live in
    # the called workflow, against the tag — see its header. Passing the tag as
    # an input is what makes them verify the published commit rather than
    # `main`'s tip; an empty one (a dispatch with no tag) falls back to this
    # run's own commit inside the callee.
    uses: ./.github/workflows/publish-app.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag || '' }}
    # `npm` is an environment on the CALLEE's publish job, so its secret is
    # injected there; inheriting costs nothing and keeps a repository-level
    # NPM_TOKEN working too.
    secrets: inherit
