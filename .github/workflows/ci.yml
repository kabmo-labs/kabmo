name: CI

# The gates every change is required to pass (CONTRIBUTING.md §1), on the pull
# request and again on `main`.
#
# They used to run only inside `release.yml` — after a merge, on the commit that was
# about to be tagged — so a red `main` was discovered by the release job that then
# refused to cut a release, and the fix was another push that ran the gates again.
# Running them here means the pull request is where a broken change is caught, and
# the release job re-running them is what keeps a tag from being cut on a red main.
#
# This file is a TRIGGER, not the implementation: the steps live in `gates.yml`,
# which `release.yml`, `publish-app.yml` and `publish-packages.yml` call and
# `needs:`.
# A gate defined here could only be a gate for this workflow — a release cannot
# `needs:` a job in another file — and a release that merely re-ran the commands
# would be a second copy that can drift from this one.
#
# The caller job is named `Gates`, but the check a commit receives is
# `Gates / Checks`, `Gates / Checks (Windows)` and `Gates / Settings schema` — a
# reusable workflow's checks are namespaced by the CALLER's job name. This
# repository's `main` ruleset requires no status checks, so the rename is inert
# here; see `gates.yml` for the measurement and what a repository with required
# checks would have to do.
#
# One of those jobs runs on `windows-latest`, and it is not a formality: the
# chamber ships a Windows CLI, and the win32 branches in its path helpers,
# `stop`'s ownership guard and the process-tree kill are otherwise never
# executed by any gate on a macOS-developed repository.
#
# Nothing here is a release: no tag, no version, no changelog. `release.yml` owns
# that, and it runs the same reusable workflow because a gate that only ever ran on
# the pull request could still be skipped by a direct push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes the run for the one before it: the answer that matters is
# the one for the newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates
    # `./` resolves the called file from the SAME commit as this caller, so the
    # gates a pull request runs are the ones it ships. (`$/…` says the same
    # thing on current GitHub, but it is newer than the `./` form and a parser
    # that rejects it fails the whole workflow — a release pipeline must not
    # depend on the newer spelling.)
    uses: ./.github/workflows/gates.yml
