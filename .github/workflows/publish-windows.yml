name: Build and attach the Windows shell

# The Windows app body, as a REUSABLE workflow — the same shape
# `publish-android.yml`, `publish-ios.yml`, `publish-macos.yml` and
# `publish-linux.yml` take, and for the same reason: the steps exist once, so a
# release run and a manual re-run cannot drift apart.
#
# TWO PHASES, like the APK body:
#
#   - `build` compiles on BOTH architectures, runs the rules suite, verifies the
#     version AND the machine type the ARTIFACT declares, and uploads one installer
#     per architecture as a run artifact. `release.yml` calls it BEFORE `app` tags,
#     so a toolchain that moved or a compile error stops the release instead of
#     shipping a tag whose GitHub release carries no shell.
#   - `attach` downloads those artifacts and attaches them to the release `app`
#     created. It runs after the tag, because `gh release upload` has nothing to
#     upload to before the release exists — and it no longer BUILDS anything, so
#     it cannot be the step that discovers a broken app.
#
# It is NOT an npm publish. The shell is a private application, so the only
# artifact is the installer attached to the GitHub release. That is why there is
# no `environment: npm` here and no registry credential: the only thing the attach
# job needs is `contents: write` on the release it uploads to.
#
# **The artifact is an INSTALLER, not a ZIP.** A ZIP leaves no Add/remove-programs
# entry, no Start-menu entry and no uninstaller, so "which version is this" and
# "how do I remove it" both have no answer. It is built by Inno Setup —
# `ISCC.exe` is preinstalled on BOTH Windows images (verified against
# actions/runner-images: "InnoSetup 6.7.1" on Windows 2022, Windows 2025 and
# Windows 11 Arm64), so this needs no third-party action and no download at run
# time.
#
# It is NOT an MSIX. MSIX requires a certificate bound to a publisher identity:
# without one Windows refuses the package, and a self-signed one shows a
# certificate warning before the installer will run. Inno produces an ordinary
# `.exe` that installs unsigned (SmartScreen warns — the README says so),
# per-user, and uninstalls cleanly. Adding a real certificate later is `SignTool=`
# in `packages/windows/installer/kabmo.iss` plus one step here.
#
# WHY A MATRIX OVER TWO RUNNERS. x64 and Arm64 are two publishes of the same
# project (`-r win-x64` / `-r win-arm64`), and each GitHub-hosted Windows image IS
# one of the two (`windows-latest` is x64, `windows-11-arm` is Arm64). Building
# each on its own architecture means the rules suite executes on the machine the
# binary targets and the installer is compiled by a native `ISCC.exe`; a
# cross-publish would produce an Arm64 binary nothing here ever ran. The artifact
# names carry the architecture (`Kabmo-<v>-win-<arch>-setup.exe`), because two
# installers with one name would collide on the release.
#
# The gates are NOT called here. `release.yml`'s `win-build` job `needs:
# windows`, which depends transitively on both gate jobs — and `app` `needs:
# win-build`, so nothing is tagged from a tree this body failed to build.
# `publish-app.yml` DOES call them, because a tag can be pushed by hand and nothing
# else would have verified it; this body is only reachable through `release.yml` or
# a manual dispatch that names an existing release.

on:
  workflow_call:
    inputs:
      # Which phase to run.
      #
      # `build` — compile, verify and upload the artifacts. `release.yml`'s
      # `win-build` job uses this, with no tag, so nothing is attached before the
      # release exists.
      #
      # `attach` — download the artifacts from THIS run and upload them to `tag`.
      mode:
        description: build (compile + upload artifact) or attach (upload to a release).
        required: false
        type: string
        default: build
      # The commit to build, in this order: `ref`, then `tag`, then the caller's own
      # commit.
      #
      # `release.yml` passes `main`, never the run's starting sha: the `windows`
      # bump job has just pushed the shell version, and the bump is what the
      # assembly's `Version` — and therefore the asset name — comes from. Building
      # the trigger commit would produce an app declaring the PREVIOUS shell
      # version, an update no installed app is ever offered.
      ref:
        description: Commit to build the app from; empty falls back to the tag, then the caller's commit.
        required: false
        type: string
      # The release to attach to. Empty means build only.
      tag:
        description: Release tag to attach the app to; empty builds without attaching.
        required: false
        type: string
  # The re-run path, which every other publish body has. Without it a failed
  # Windows build could only be retried by re-running the whole release — and when
  # the failure is in the TOOLCHAIN (a moved .NET SDK, a missing WebView2 package),
  # the release itself is fine and only this artifact is missing.
  #
  # `mode` is deliberately NOT an input here: a dispatch has no earlier call in its
  # own run to have uploaded an artifact, so an attach-only dispatch would have
  # nothing to download. Every dispatch BUILDS, and attaches when it was given a
  # tag — which is exactly the repair for a release that went out with no app.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the app to (e.g. v0.6.0)
        required: false
        type: string
      ref:
        description: Commit to build; empty builds the tag, so the repair matches its release
        required: false
        type: string

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1 — the gate. `release.yml` runs this before `app` tags.
  # ---------------------------------------------------------------------------
  build:
    name: Build the Windows app (${{ matrix.arch }})
    # Everything except an explicit `attach` call. Stated as "not attach" rather
    # than "== build" because a `workflow_dispatch` carries no `mode` at all, and a
    # dispatch must build — an equality test would silently skip the build and leave
    # the attach with nothing to download.
    if: ${{ inputs.mode != 'attach' }}
    # `fail-fast: false` so one architecture failing still reports the other's
    # result: a repair needs to know whether BOTH installers are broken or only one.
    strategy:
      fail-fast: false
      matrix:
        include:
          # `windows-latest` resolves to the x64 Windows 2025 image.
          - arch: x64
            rid: win-x64
            runner: windows-latest
          # The Arm64 image. Verified against actions/runner-images: it carries the
          # .NET 8 SDK and "InnoSetup 6.7.1", which is everything this job needs.
          - arch: arm64
            rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      # The build reads the tree and uploads a run artifact; it needs no write
      # access to the repository.
      contents: read
    steps:
      # The commit to build, not the branch: `release.yml` names `main`, because the
      # shell bump job pushed the version the app must declare. A manual dispatch
      # names a TAG and builds that, so a repair matches the release it repairs. The
      # `github.sha` fallback covers a caller that names neither.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.sha }}

      # .NET 8: the app targets `net8.0-windows`, and the runner's default SDK is
      # not guaranteed to be 8 (it moves). `dotnet` is preinstalled on both images,
      # but pinning the channel is what makes the build reproducible rather than a
      # property of the image.
      #
      # No `architecture` input: `setup-dotnet@v4` does not declare one, and it is
      # not needed — the SDK is installed per image in the image's OWN architecture
      # (verified: the `windows-11-arm` readme lists .NET 8.0.131 … 8.0.425), so
      # `8.0.x` resolves to the host build and downloads nothing. The TARGET
      # architecture is `-r` below, and the artifact's PE header is what proves it.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The rules suite — the server list's decisions, the probe, the record reader,
      # the wire format. Plain `net8.0`, no window server, so it is the one piece of
      # the shell with real logic that can be checked in a second.
      #
      # It runs HERE rather than in `gates.yml` for the Android suite's reason: the
      # .NET toolchain would otherwise be installed for every pull request, and this
      # job is the only place it pays for itself. It targets `net8.0` with no RID, so
      # it executes on whichever architecture this runner is.
      - name: Rules suite
        run: dotnet run --project packages/windows/tests/KabmoDesktop.Tests.csproj -c Release

      # The version is NOT the tag. It is `packages/windows/version.properties`,
      # bumped by the `windows` job of `release.yml` when the shell changed — which
      # is what makes the number the asset carries the number the running app
      # reports over the bridge.
      #
      # `release/windows-version.mjs` is the ONE reader of that file: the same
      # `readVersionName` the bump script and its tests use.
      - name: Read the shell version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node release/windows-version.mjs)"
          echo "Shell version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Self-contained so the artifact runs on a machine with no .NET installed —
      # the same reason the macOS shell prefers a bundled server over a PATH lookup.
      #
      # The version is NOT passed here: `KabmoDesktop.App.csproj` reads
      # `version.properties` itself (`ReadShellVersion`), so a `-p:Version` would be
      # a second source that could disagree with the file the asset name comes from.
      #
      # `-r ${{ matrix.rid }}` is the ONLY thing that differs between the two rows,
      # and it is what makes the artifact's machine type match its name.
      - name: Publish
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish packages/windows/src/KabmoDesktop.App/KabmoDesktop.App.csproj `
            -c Release `
            -r $env:RID `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o build/Kabmo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed ($LASTEXITCODE)" }

      # A version check on the ARTIFACT, not on the build file: this reads what
      # `Kabmo.exe` actually declares, so a missing or unparsed `version.properties`
      # is caught here instead of shipping a release whose app reports a number the
      # pipeline never published.
      #
      # The MACHINE TYPE is checked from the PE header rather than assumed from the
      # `-r` argument: a runtime pack that silently resolved to the host
      # architecture would produce an `arm64`-named installer carrying an x64 app,
      # which fails on the user's machine and nowhere in this pipeline.
      - name: Verify the artifact's version and architecture
        shell: pwsh
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
          EXPECTED_MACHINE: ${{ matrix.arch == 'arm64' && '0xAA64' || '0x8664' }}
        run: |
          $exe = 'build/Kabmo/Kabmo.exe'
          if (-not (Test-Path $exe)) { throw "publish produced no $exe" }
          $info = (Get-Item $exe).VersionInfo
          Write-Host "product=$($info.ProductName) file=$($info.FileVersion) productVersion=$($info.ProductVersion)"
          if ($info.ProductName -ne 'Kabmo') { throw "the app's product name is '$($info.ProductName)', not 'Kabmo'" }
          # `FileVersion` is four-part (`0.1.0.0`); the declared version is three.
          if (-not $info.FileVersion.StartsWith("$env:EXPECTED.")) {
            throw "Kabmo.exe declares $($info.FileVersion), not $env:EXPECTED"
          }

          # PE header: `e_lfanew` at 0x3C points at the COFF header, whose first
          # field is the machine type. 0x8664 = x64, 0xAA64 = Arm64.
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $machine = '0x{0:X4}' -f [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host "machine=$machine expected=$env:EXPECTED_MACHINE"
          if ($machine -ne $env:EXPECTED_MACHINE) {
            throw "Kabmo.exe is $machine, expected $env:EXPECTED_MACHINE"
          }

      # The installer. `ISCC.exe` is preinstalled on both images, so this is a
      # compile step rather than a download.
      #
      # The version and the architecture are passed on the COMMAND LINE —
      # `/DAppVersion` and `/DAppArch` — rather than written into the `.iss`, for the
      # same reason the csproj does not state the version: one declared fact. The
      # `.iss` turns `AppArch` into the installer's own `ArchitecturesAllowed` and
      # `ArchitecturesInstallIn64BitMode`, so an Arm64 installer cannot install on an
      # x64 machine (where it would produce a window that never paints).
      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DAppArch=$env:ARCH" `
            "/DSourceDir=$PWD\build\Kabmo" `
            packages/windows/installer/kabmo.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      # A version check on the INSTALLER, not only on the app: the file a user
      # downloads must declare the number the release carries, or the release page
      # and the thing it hands out disagree. `OutputBaseFilename` is
      # `Kabmo-<v>-win-<arch>-setup`, so the name is the assertion.
      - name: Verify the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $expected = "Kabmo-$env:VERSION-win-$env:ARCH-setup.exe"
          $installer = "build/installer/$expected"
          if (-not (Test-Path $installer)) {
            throw "no $installer was produced"
          }
          $info = (Get-Item $installer).VersionInfo
          Write-Host "installer=$expected product=$($info.ProductName) version=$($info.ProductVersion)"
          # Inno writes the AppVersion it compiled with into the file's own
          # metadata, so this reads the artifact rather than the script.
          if (-not $info.ProductVersion.StartsWith($env:VERSION)) {
            throw "the installer declares $($info.ProductVersion), not $env:VERSION"
          }
          Get-ChildItem build/installer/*.exe | Format-Table Name, Length

      # The artifact is what the `attach` phase uploads — and what makes the two
      # calls one pipeline rather than two independent builds. It is the installer
      # the checks above passed, so attaching cannot substitute a different one.
      #
      # One artifact per architecture: the attach phase merges them back, and a
      # single shared name would make the second row overwrite the first.
      #
      # Retention is a day: the only consumer is the attach call in this same run
      # (or a dispatch's own attach), so a longer window would only clutter the run's
      # artifacts with binaries nothing reads.
      - name: Upload the app artifact
        uses: actions/upload-artifact@v4
        with:
          name: kabmo-windows-app-${{ matrix.arch }}
          path: build/installer/*.exe
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Phase 2 — the upload. `release.yml` runs this after `app` tagged.
  # ---------------------------------------------------------------------------
  attach:
    name: Attach the Windows app to the release
    needs: build
    # `always()` because a skipped `build` must not skip the attach with it: the
    # release run calls this body twice, and the second call is attach-only. The
    # result check keeps a FAILED build blocking the upload — there would be no
    # artifact to attach, and a release carrying a stale one is worse than a
    # release with none.
    if: ${{ always() && inputs.tag != '' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Uploading an asset to an existing release needs `contents: write`.
      contents: write
    steps:
      # `pattern` rather than a name: the build phase uploads one artifact per
      # architecture, and `merge-multiple` puts both installers in one directory so
      # a single `gh release upload` carries the pair.
      - name: Download the app artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kabmo-windows-app-*
          merge-multiple: true
          path: .

      # `GH_REPO` because this job deliberately checks nothing out, and `gh`
      # otherwise dies with "not a git repository" — a wrong reason for a real
      # failure, measured on the Android twin. Verified on this body: the run for
      # `v0.6.0` failed exactly that way, with the artifact downloaded and
      # `ls -l ./*.exe` printed, so the upload itself was never attempted.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # An unmatched pattern stays literal, so `set -- *.exe` would report one
          # argument holding the text `*.exe` — measured, and it would let a missing
          # architecture pass a count of 1.
          shopt -s nullglob
          ls -l
          # Both architectures must be present, or a release goes out that installs
          # on one Windows machine and not the other.
          set -- ./*.exe
          test "$#" = "2" \
            || { echo "expected 2 Windows installers (x64 + arm64), found $#: $*"; exit 1; }
          # `--clobber` so a repair dispatch replaces the asset rather than failing
          # on a name that already exists.
          gh release upload "$TAG" ./*.exe --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
