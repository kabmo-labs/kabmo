name: E2E

# Browser end-to-end specs (Playwright) against a real server booted from a temp
# root. This is the layer above `bun test` — it catches what a component mount
# cannot: a broken client bundle, a stream that never settles, a layout that
# clips at a real panel width.
#
# Runs on a pull request only when the `e2e` label is applied, nightly, and on
# manual dispatch. A push to `main` is verified by `release.yml`, whose `e2e` job
# calls this same reusable workflow on the same commit — so a `push:` trigger
# here ran the whole browser matrix a second time on every merge (measured on
# 26333b1: E2E 25m17s beside Release's `E2E specs / Chromium`, 18 minutes of it
# overlapping). The nightly cron still runs the suite against `main`'s tip when
# nothing has been pushed, which is coverage the merge-time run never had.
#
# The specs run in `mock` mode (seeded demo data, no `omp` install) and `real`
# mode (a scripted fake `omp` speaking omp's own RPC wire protocol — no model,
# no network, no token spend). Chromium is the required leg; firefox/webkit are
# opt-in via `--project` and are not run here yet.
#
# This file is a TRIGGER, not the implementation: the job lives in
# `e2e-specs.yml`, which `release.yml`, `publish-app.yml` and `publish-packages.yml`
# call and `needs:`. A release that only re-ran the suite would race a parallel
# run and could publish from a commit whose specs had not finished failing —
# calling the same reusable workflow is what makes the browser layer a
# requirement rather than a parallel opinion.
#
# The `e2e` label condition stays HERE, on the trigger: it decides whether a
# pull request pays for the job, and it is the one context where a label exists.
# A release calls the reusable workflow directly and always runs it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    # Nightly, 09:41 UTC (off the hour so it does not queue behind other cron).
    - cron: "41 9 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium specs
    # Nightly and manual runs always go; a pull request only with the label. A
    # fork PR has no label from us, which is also the right default — the job is
    # not free.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'e2e')
    uses: ./.github/workflows/e2e-specs.yml
