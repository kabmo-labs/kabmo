name: E2E

# Browser end-to-end specs (Playwright) against a real server booted from a temp
# root. This is the layer above `bun test` — it catches what a component mount
# cannot: a broken client bundle, a stream that never settles, a layout that
# clips at a real panel width.
#
# Runs on every push to `main` like the other gates, plus a pull request only
# when the `e2e` label is applied, plus nightly and manual dispatch. A push to
# `main` is the merge of a reviewed PR, so the browser layer is verified there
# even when the label was never applied — the label is the cheap-PR escape
# hatch, not the only way in. The release job's own `[skip ci]` commits do not
# re-trigger this (verified: the `chore(release)` commit carries no CI/E2E run).
#
# The specs run in `mock` mode (seeded demo data, no `omp` install) and `real`
# mode (a scripted fake `omp` speaking omp's own RPC wire protocol — no model,
# no network, no token spend). Chromium is the required leg; firefox/webkit are
# opt-in via `--project` and are not run here yet.
#
# This file is a TRIGGER, not the implementation: the job lives in
# `e2e-specs.yml`, which `release.yml`, `publish.yml` and `publish-plugins.yml`
# call and `needs:`. Those runs are raised by the same push as this one (or by
# the tag it produced), so a release that only re-ran the suite would race this
# run and could publish from a commit whose specs had not finished failing —
# calling the same reusable workflow is what makes the browser layer a
# requirement rather than a parallel opinion.
#
# The `e2e` label condition stays HERE, on the trigger: it decides whether a
# pull request pays for the job, and it is the one context where a label exists.
# A release calls the reusable workflow directly and always runs it.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    # Nightly, 09:41 UTC (off the hour so it does not queue behind other cron).
    - cron: "41 9 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium specs
    # Push, nightly and manual runs always go; a pull request only with the
    # label. A fork PR has no label from us, which is also the right default —
    # the job is not free.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'e2e')
    uses: ./.github/workflows/e2e-specs.yml
