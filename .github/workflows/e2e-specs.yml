name: E2E specs

# The browser end-to-end suite (Playwright) as a REUSABLE workflow, so a release
# can REQUIRE it instead of hoping a parallel run passed.
#
# `e2e.yml` is the PULL REQUEST trigger: a pull request only when the `e2e` label
# is applied, nightly, and manual dispatch. `release.yml`, `publish.yml` and
# `publish-plugins.yml` CALL this file and `needs:` it — a release tags a commit
# whose pull request may never have run a browser at all (the label is the
# escape hatch), so the suite is a REQUIREMENT of that run rather than a parallel
# opinion it could wait on.
#
# The PR label condition deliberately does NOT live here. A reusable workflow's
# job `if:` is evaluated in the CALLER's context, but the condition is a property
# of the `e2e.yml` trigger, not of the suite: a release must run the browser
# specs whatever labels a pull request carried. It stays on `e2e.yml`'s caller
# job, which is the only place a label exists.
#
# `timeout-minutes` and `runs-on` are also absent from the caller jobs on purpose:
# a job that calls a reusable workflow accepts only `name`, `uses`, `with`,
# `secrets`, `strategy`, `needs`, `if`, `concurrency`, `permissions` and
# `cache-mode` — everything else belongs here.
#
# TWO operating systems run the same suite, because Kabmo's Windows-only code
# paths are otherwise never executed by a browser: the CLI's path helpers,
# `stop`'s ownership guard and the `taskkill` tree kill. See the
# `chromium-windows` job for what the harness had to change to make that
# possible (it is not a portability nicety — `Bun.spawn` cannot start a shell
# script on Windows at all) and for the two specs that skip themselves there.
#
# Each operating system is SHARDED across runners, and that is a measurement
# rather than a preference. The suite is 163 tests at `workers: 1` (see
# `tests/e2e/playwright.config.ts` for why one worker per machine), and on the
# release run of 2026-11-11 it took 27.7 min on Windows and 13.9 min on Linux —
# 87% of that run's 33 min wall clock, with every other job under 8 min. Raising
# `workers` is NOT the fix: measured on this suite, `--workers=2` bought 12%
# (1.7m -> 1.5m over 21 tests) and made two specs flake, because two servers and
# two browsers contend for the same CPU and the assertions are timing-sensitive.
# A shard is a separate MACHINE, so it keeps the one-worker-per-machine property
# the config depends on and scales linearly.
#
# The split is 2 shards on Linux and 4 on Windows, chosen so the two legs finish
# together: 89 + 74 tests at 5.1 s each is ~7 min on Linux, 41/48/36/38 at
# 10.3 s each is ~7 min on Windows (both per-test costs measured on that run,
# both splits verified with `--list`). `--shard` balances by TEST COUNT, not
# duration, so the shards are not exactly equal — the timeouts below are ~3x the
# expected shard, which is still a hang detector.
#
# `fail-fast: false` is load-bearing: a red shard must not cancel the others,
# because the failure artifacts of every shard are what a reader needs to see
# whether the failure is one spec or the whole leg.
on:
  workflow_call:
    inputs:
      # See `gates.yml`: empty is the caller's own commit, and `publish.yml`
      # names the tag it is about to publish.
      ref:
        description: Git ref to check out; empty means the caller's commit.
        required: false
        type: string

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # ~7 min expected per shard (see the header); 20 is a hang detector, not a
    # budget.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The browser download is the slow half of the job; the cache key is the
      # resolved Playwright version, so a bump refetches and a source change
      # does not. Pinned by the lockfile — the version is not repeated here.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # A separate gate so a type error in the specs is reported as one, not as
      # a mysterious "project not found" three steps later.
      - name: Typecheck the E2E layer
        run: bun run typecheck:e2e

      - name: Run the specs
        run: bun run test:e2e --project=chromium --shard=${{ matrix.shard }}/2
        env:
          CI: "true"

      # Traces, screenshots and the HTML report are the evidence a failing spec
      # owes the reader; a red run with no artifact is a red run nobody can act
      # on. Uploaded only on failure, because the report is large. The shard
      # number is in the name because every shard uploads its own.
      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The same browser specs on Windows.
  #
  # The specs drive a REAL Kabmo server, and the parts of that server a Mac
  # never exercises are exactly the ones a browser spec is best at catching: the
  # CLI's path handling, `stop`'s ownership guard, the process-tree kill
  # (`taskkill` rather than a group signal) and the spawn of an `omp` child.
  # Three of the last five commits on `main` are Windows fixes to those paths.
  #
  # The harness itself had to change for this to be possible, and the change is
  # a fact about Windows rather than a preference: `Bun.spawn` there resolves a
  # program through libuv's `search_path`, which tries only `.com` and `.exe`
  # ("Since CreateProcess can start only .com and .exe files, only those
  # extensions are tried"). The scripted `omp` the specs drive is therefore a
  # `bun build --compile` binary, not the `#!/bin/sh` shim it used to be — a
  # shell script and a `.cmd` are both unspawnable there however they are
  # chmod-ed. Teardown uses `taskkill /t`, since Windows has no process groups.
  #
  # Two specs skip themselves on Windows and both say why in their own header:
  # the terminal spec (the server's PTY is a `Bun.Terminal`, which is POSIX-only)
  # and the command-runner stop case (it needs a `#!/bin/sh` marker script and
  # `pgrep`). Everything else runs.
  #
  # `--project=chromium` only. A cross-platform browser difference is not what
  # this leg is for; the OS is the variable under test.
  # ---------------------------------------------------------------------------
  chromium-windows:
    name: Chromium (Windows ${{ matrix.shard }}/4)
    runs-on: windows-latest
    # ~7 min expected per shard (see the header). The Windows runner is slower
    # per spec than the Linux one, and a timeout that a slow runner trips reads
    # as a failure of the change — 25 is ~3x the expected shard.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The browser download is the slow half of the job; the cache key is the
      # resolved Playwright version, so a bump refetches and a source change
      # does not. Separate from the Linux cache: the archives are per-platform.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # No `--with-deps` here: that flag installs Linux system packages through
      # apt, which does not exist on Windows. The browser download is all this
      # leg needs.
      - name: Install Chromium
        run: bunx playwright install chromium

      # A separate gate so a type error in the specs is reported as one, not as
      # a mysterious "project not found" three steps later.
      - name: Typecheck the E2E layer
        run: bun run typecheck:e2e

      - name: Run the specs
        run: bun run test:e2e --project=chromium --shard=${{ matrix.shard }}/4
        env:
          CI: "true"

      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
