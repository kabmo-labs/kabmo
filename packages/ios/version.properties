# The iOS shell's version, and the ONLY place it is declared.
#
# Read by `scripts/build-ipa.sh` (through `release/ios-version.mjs`) into the
# bundle's `CFBundleShortVersionString`, and by `release/release-shells.mjs` — which
# bumps it when `packages/ios` changes. The shell appends `KabmoIOS/<versionName>`
# to its WebView User-Agent, and the console compares that against the published
# asset's version, so this number is the entire delivery mechanism.
#
# Deliberately a file rather than a build flag, for the reason
# `packages/android/version.properties` documents at length: the number the pipeline
# publishes and the number the app reports have to be ONE decision, and a `-P`-style
# argument makes them two.
#
# Not `Package.swift` or a plist: the watermark is `git log -L` on the version LINE,
# and both of those are rewritten for reasons that release nothing.
#
# 0.1.0 is the first iOS release, and there is no migration to respect — nothing has
# ever been published, so no installed app reports an older number.
versionName=0.5.1
