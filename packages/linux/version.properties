# The Linux shell's version, and the ONLY place it is declared.
#
# Read by `build.rs` into the binary's `KABMO_SHELL_VERSION` (which is what the
# page receives as `shellVersion`), by `scripts/build-app.sh` into the packaged
# directory and the archive name, and by `release/release-shells.mjs` — which bumps
# it when `packages/linux` changes.
#
# Deliberately a file rather than the crate's `version` in `Cargo.toml`, for the
# reason `packages/android/version.properties` documents at length: the number the
# pipeline publishes and the number the app reports have to be ONE decision, and a
# `Cargo.toml` version is also the crates.io identity of a package that is never
# published. The crate keeps its own `0.1.0` and the shell reports THIS.
#
# Not `Cargo.toml` and not the `.desktop` file: the watermark is `git log -L` on the
# version LINE, and both of those are rewritten for reasons that release nothing (a
# dependency bump, a new category), so the range would start at a commit that
# released nothing.
#
# Unlike the Android and iOS shells there is no User-Agent token here — but the
# console DOES offer this app an update, over the bridge: `build.rs` bakes this
# value into the binary as `KABMO_SHELL_VERSION`, the shell reports it as
# `__kabmoDesktop.shellVersion`, and the console compares it against the published
# asset. The UA is not used because a desktop request would carry the token on
# every asset for a string the bridge already supplies before the first paint.
versionName=0.6.2
