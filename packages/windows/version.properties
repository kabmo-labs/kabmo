# The Windows shell's version, and the ONLY place it is declared.
#
# Read at BUILD time by `src/KabmoDesktop.App/KabmoDesktop.App.csproj` (into the
# assembly's `Version`, which is what the shell reports over the bridge as
# `shellVersion`), and by `release/release-windows.mjs` — which bumps it when
# `packages/windows` changes. `publish-windows.yml` names the release asset from
# the same file, so the version the running app reports and the version in the
# published name are the same number by construction.
#
# No User-Agent token, unlike `packages/{android,ios}/version.properties` — but the
# console DOES offer this app an update, over the bridge: the shell reports the
# assembly's `Version` as `__kabmoDesktop.shellVersion` and the sidebar compares it
# against the published asset. A UA token would mean every asset request carried a
# string the bridge already supplies before the first paint.
#
# Deliberately a file rather than an MSBuild property, for the reason
# `packages/android/version.properties` documents at length: the number the
# pipeline publishes and the number the app reports have to be ONE decision, and
# a `-p:` argument makes them two.
#
# Not the `.csproj` itself: the watermark is `git log -L` on the version LINE,
# and that file is rewritten for reasons that release nothing (a package bump, a
# new build flag) — the range would then start at a commit that released
# nothing.
#
# 0.1.0 is the first Windows release: nothing has ever been published, so no
# installed shell reports an older number and there is no migration to respect.
versionName=0.4.1
