<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan pairing code</title>
<!--
  The shell's own QR scanner, hosted in the shell's own web view.

  ONE PAGE, THREE HOSTS. Android, Windows and Linux all load this file; the Apple
  shells use AVFoundation instead, because the decoder is built into the platform
  there. `page.html` is the source and `qr-scanner.html` is generated from it by
  `bun packages/qr-scanner/build.mjs` — the only difference is the inlined jsQR
  bundle, which is 131 KB of minified JavaScript and not something to hand-edit.

  WHY A PAGE AND NOT NATIVE CAMERA CODE: the shells are web-view apps, and the
  decoder that already exists and is already tested is `jsQR` (the console's
  login screen uses it). A native scanner would be a second decoder per platform
  — Camera2 + ZXing on Android, MediaCapture + ZXing.Net on Windows, GStreamer +
  rqrr on Linux — three dependencies and three chances to disagree about what a
  valid code is. The camera PERMISSION is still native: the host grants
  `RESOURCE_VIDEO_CAPTURE` / `.camera` and this page only asks.

  WHY jsQR IS INLINED EVERYWHERE: `BarcodeDetector` exists only where the OS has
  a barcode provider — Android WebView 83+, and Chromium on macOS/ChromeOS.
  WebView2 on Windows has none (Chromium hides the interface on platforms with no
  provider since M88, crbug 40725008) and WebKitGTK has none, so a page that
  relied on it alone decoded nothing on Windows: the camera preview ran and never
  read a frame, and every uploaded image answered "No QR code was found". The
  page prefers `BarcodeDetector` where it exists (native, faster) and falls back
  to jsQR.

  The host must load this with an HTTPS base URL (`https://kabmo.local/`), not
  `file://` or `about:blank`: `getUserMedia` needs a secure context, and a
  document with an opaque origin does not have one.

  The host provides ONE of these bridges, and the page tries them in order:
    window.KabmoQr.result(text) / .error(message) / .pickImage()
        — Android's `addJavascriptInterface(Bridge(), "KabmoQr")`
    window.__kabmoQrResult(text) / window.__kabmoQrError(message)
        — a host that injects two functions instead of an object
    window.chrome.webview.postMessage({ type, text })
        — WebView2, which has no injected object
    window.webkit.messageHandlers.kabmoQr.postMessage({ type, text })
        — WebKitGTK's script message handler
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #141310; color: #f7f5f0;
               font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #frame { position: absolute; inset: 12% 12%; border: 2px solid rgba(247,245,240,.85);
           border-radius: 12px; pointer-events: none; }
  #status { margin: 0; padding: 14px 18px 6px;
            text-align: center; font-size: 13px; color: rgba(247,245,240,.8); }
  #status.error { color: #ff9d9d; }
  #upload { display: block; margin: 0 auto calc(14px + env(safe-area-inset-bottom, 0px));
            padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(247,245,240,.3);
            background: transparent; color: rgba(247,245,240,.85); font: inherit; font-size: 12px; }
  #upload[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div id="frame" aria-hidden="true"></div>
</div>
<p id="status">Point the camera at the pairing code</p>
<button id="upload" type="button">Upload an image instead</button>
<script id="jsqr">
/* jsQR — generated by `bun packages/qr-scanner/build.mjs`; do not edit. */
</script>
<script>
(function () {
  var video = document.getElementById('video');
  var status = document.getElementById('status');
  var stopped = false;

  // One report path, three hosts. A host that provides none of them still shows
  // the sentence on screen, which is the honest degradation.
  function report(type, text) {
    // Android injects one object (`addJavascriptInterface(Bridge(), "KabmoQr")`)
    // rather than two functions, and it is the host that also owns the file
    // picker. Checked first, and by exact method name: a mismatch here is silent
    // — the page draws "Code read." and the Activity never hears about it, so
    // the scanner sits on that sentence until the user backs out.
    if (window.KabmoQr && typeof window.KabmoQr.result === 'function') {
      if (type === 'code') window.KabmoQr.result(text);
      else if (typeof window.KabmoQr.error === 'function') window.KabmoQr.error(text);
      return;
    }
    if (typeof window.__kabmoQrResult === 'function') {
      if (type === 'code') window.__kabmoQrResult(text);
      else if (typeof window.__kabmoQrError === 'function') window.__kabmoQrError(text);
      return;
    }
    if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
      window.chrome.webview.postMessage({ type: type, text: text });
      return;
    }
    var handlers = window.webkit && window.webkit.messageHandlers;
    if (handlers && handlers.kabmoQr && typeof handlers.kabmoQr.postMessage === 'function') {
      handlers.kabmoQr.postMessage({ type: type, text: text });
    }
  }

  function fail(message) {
    status.textContent = message;
    status.className = 'error';
    report('error', message);
  }

  function done(text) {
    if (stopped) return;
    stopped = true;
    stopStream();
    status.textContent = 'Code read.';
    report('code', text);
  }

  var stream = null;
  function stopStream() {
    if (!stream) return;
    for (var i = 0; i < stream.getTracks().length; i += 1) stream.getTracks()[i].stop();
    stream = null;
  }

  if (!window.isSecureContext) {
    fail('The camera needs a secure address. Use the pairing link instead.');
    return;
  }
  if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
    fail('This device does not offer a camera to the app. Use the pairing link instead.');
    return;
  }

  // `BarcodeDetector` where the platform has it (native, faster), `jsQR` always
  // as the fallback — see the header for why the fallback is not optional.
  var detector = null;
  if (typeof window.BarcodeDetector === 'function') {
    try { detector = new window.BarcodeDetector({ formats: ['qr_code'] }); } catch (_) { detector = null; }
  }
  if (!detector && typeof window.jsQR !== 'function') {
    // The bundle failed to load. No decoder means the upload path cannot work
    // either, so the button goes with the camera: a control whose only outcome
    // is a refusal is worse than no control.
    document.getElementById('upload').hidden = true;
    fail('This device cannot read codes. Use the pairing link instead.');
    return;
  }
  var canvas = document.createElement('canvas');
  var context = canvas.getContext('2d', { willReadFrequently: true });

  // jsQR over a canvas copy of `image`. Synchronous, and the only path on a
  // platform without `BarcodeDetector`.
  function decodeWithJsQR(image) {
    if (typeof window.jsQR !== 'function' || !context) return null;
    var width = image.width || image.naturalWidth || 0;
    var height = image.height || image.naturalHeight || 0;
    if (!width || !height) return null;
    canvas.width = width;
    canvas.height = height;
    context.drawImage(image, 0, 0, width, height);
    var pixels = context.getImageData(0, 0, width, height);
    var found = window.jsQR(pixels.data, width, height, { inversionAttempts: 'attemptBoth' });
    return found && found.data ? found.data : null;
  }

  // One decode, two sources: a video frame and an uploaded image. The image path
  // exists for the device with no camera — a tablet, a desktop, a phone whose
  // camera is broken — which received the code as a screenshot.
  //
  // `BarcodeDetector` first, jsQR second, and a detector that never settles is
  // abandoned after `IMAGE_DECODE_TIMEOUT_MS`: a promise that hangs would leave
  // the page on "Reading the image…" forever, which is exactly the stuck screen
  // this fallback exists to prevent.
  var IMAGE_DECODE_TIMEOUT_MS = 4000;

  function withTimeout(promise, ms) {
    return new Promise(function (resolve) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        resolve(null);
      }, ms);
      promise.then(function (value) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        resolve(value);
      }, function () {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        resolve(null);
      });
    });
  }

  function decodeImage(image) {
    var attempts = [];
    if (detector) {
      attempts.push(function () {
        return detector.detect(image).then(function (codes) {
          return codes && codes.length > 0 ? codes[0].rawValue : null;
        });
      });
    }
    if (typeof window.jsQR === 'function') {
      attempts.push(function () { return Promise.resolve(decodeWithJsQR(image)); });
    }
    var index = 0;
    function next() {
      if (index >= attempts.length) return Promise.resolve(null);
      var attempt = attempts[index];
      index += 1;
      return withTimeout(attempt(), IMAGE_DECODE_TIMEOUT_MS).then(function (text) {
        return text ? text : next();
      });
    }
    return next();
  }

  // The host may hand the page an image instead of opening the camera: it owns
  // the file picker, so the page never needs one (a WebView file chooser is a
  // second permission path for no benefit).
  window.__kabmoQrImage = function (dataUrl) {
    stopStream();
    status.textContent = 'Reading the image…';
    var image = new Image();
    image.onload = function () {
      decodeImage(image).then(function (text) {
        if (text) done(text);
        else fail('No QR code was found in that image. Try a sharper screenshot, or paste the link instead.');
      });
    };
    image.onerror = function () {
      fail('That file could not be read as an image.');
    };
    image.src = dataUrl;
  };

  function decodeFrame() {
    if (stopped) return;
    if (video.videoWidth > 0 && video.videoHeight > 0) {
      if (detector) {
        detector.detect(video).then(function (codes) {
          if (codes && codes.length > 0 && codes[0].rawValue) done(codes[0].rawValue);
        }).catch(function () { /* a frame that cannot be read is not an error */ });
      } else {
        var found = decodeWithJsQR(video);
        if (found) done(found);
      }
    }
    setTimeout(decodeFrame, 150);
  }

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
    audio: false
  }).then(function (opened) {
    stream = opened;
    video.srcObject = opened;
    var played = video.play();
    if (played && typeof played.catch === 'function') played.catch(function () {});
    decodeFrame();
  }).catch(function (error) {
    var name = error && error.name ? error.name : '';
    fail(name === 'NotAllowedError'
      ? 'The camera was blocked. Allow it for this app, or use the pairing link instead.'
      : name === 'NotFoundError'
        ? 'No camera was found on this device. Use the pairing link instead.'
        : 'The camera could not be opened. Use the pairing link instead.');
  });

  // The host owns the file picker: a WebView file chooser is a second permission
  // path for no benefit, and every host already has a native one. Each host
  // exposes it through whichever bridge it has.
  var pick = null;
  if (typeof window.__kabmoQrPickImage === 'function') {
    pick = window.__kabmoQrPickImage;
  } else if (window.KabmoQr && typeof window.KabmoQr.pickImage === 'function') {
    pick = function () { window.KabmoQr.pickImage(); };
  } else if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
    pick = function () { window.chrome.webview.postMessage({ type: 'pick' }); };
  } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kabmoQr) {
    pick = function () { window.webkit.messageHandlers.kabmoQr.postMessage({ type: 'pick' }); };
  }

  var upload = document.getElementById('upload');
  if (pick) {
    upload.addEventListener('click', pick);
  } else {
    // No picker on this host: the button would do nothing, and a control that
    // does nothing is worse than no control.
    upload.hidden = true;
  }

  window.addEventListener('pagehide', stopStream);
})();
</script>
</body>
</html>
