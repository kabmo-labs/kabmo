# The Android shell's version, and the ONLY place it is declared.
#
# Read at Gradle configuration time by `app/build.gradle.kts`, and by
# `release/release-android.mjs` — which bumps it when `packages/android`
# changes. Both `versionName` (this number) and the `KabmoAndroid/<versionName>`
# token the shell appends to its WebView User-Agent come from here, so the
# version the console reads off the UA and the version published on the release
# asset are the same number by construction.
#
# Not `build.gradle.kts` itself: the watermark is `git log -L` on the version
# LINE, and that file is rewritten for reasons that have nothing to do with a
# release (a dependency bump, a new build flag) — the range would then start at
# a commit that released nothing.
#
# 0.3.0, not 0.1.0, and the reason is the migration. Before this file existed
# the APK's versionName WAS the app's release tag, so the last shipped APK
# (`kabmo-android-v0.2.0.apk`) makes every installed shell report
# `KabmoAndroid/0.2.0`. Starting below that would make `isNewer` answer false for
# the first independent shell release and no installed app would ever be offered
# it.
#
# 0.5.0 is the SIGNING migration, and it is written by hand on purpose. Every
# APK up to and including 0.4.0 was signed with the debug key, which the runner
# regenerates per job — so those three releases carry three different
# certificates and none of them can be installed over another
# (`INSTALL_FAILED_UPDATE_INCOMPATIBLE`). The release workflow now refuses to
# build without the release keystore, and 0.5.0 is the first APK signed with it.
# Two consequences, both deliberate:
#
# - **0.5.0 still cannot install over 0.4.0**, because 0.4.0's key is gone.
#   Every install after 0.5.0 updates in place. The one-time uninstall is the
#   whole reason this is a minor bump rather than a patch.
# - Writing this line stops `release/release-android.mjs` from bumping again:
#   its watermark is the commit that last wrote the version LINE, so this commit
#   is the start of the range and there is nothing after it yet.
versionName=0.7.0
