# The macOS shell's version, and the ONLY place it is declared.
#
# Read by `scripts/build-app.sh` into the bundle's `CFBundleShortVersionString`,
# and by `release/release-shells.mjs` — which bumps it when `packages/macos`
# changes.
#
# Deliberately a file rather than a build flag, for the reason
# `packages/android/version.properties` documents at length: the number the
# pipeline publishes and the number the app reports have to be ONE decision, and
# a `-P`-style argument makes them two.
#
# Not `Package.swift` and not `Info.plist`: the watermark is `git log -L` on the
# version LINE, and both of those are rewritten for reasons that release nothing
# (a target rename, a new menu item, a plist key), so the range would start at a
# commit that released nothing.
#
# Unlike the Android and iOS shells there is no User-Agent token here — but the
# console DOES offer this app an update, over the bridge: `App.swift` reports
# `ShellVersion.current()` (read from `CFBundleShortVersionString`, which the build
# script fills from THIS file) as `__kabmoDesktop.shellVersion`, and the console
# compares it against the published asset. A literal in `App.swift` was a second
# number for one build, and it drifted: the pipeline bumped this file while the
# running app kept reporting the old one.
versionName=0.5.0
