<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Kabmo">
  <title>Kabmo</title>
  <!-- Full-canvas tile, the geometry the previous icon used: the launcher, the
       tab and the dock each apply their own mask, and an inset tile would leave
       a margin inside the mask instead of behind it. -->
  <rect width="64" height="64" rx="14" fill="#0B5D3B"/>
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 15v34" stroke="#F7F4EA"/>
    <path d="M20 32 42 15" stroke="#F26522"/>
    <path d="M20 32 42 49" stroke="#F7F4EA"/>
  </g>
</svg>
