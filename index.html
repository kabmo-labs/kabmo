<!doctype html>
<html lang="en" data-theme="paper" data-theme-variant="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The theme's canvas color. The SSR shell rewrites this tag in place;
         a second tag would be ignored, since Chrome reads the first. -->
    <meta name="theme-color" content="#faf8f3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kabmo" />
    <meta
      name="description"
      content="Web console and diagnostic workbench for Oh-My-Pi agent sessions: watch, steer and audit autonomous coding runs from one paper-flat dashboard."
    />
    <title>Kabmo</title>
    <!-- Inline and in the head on purpose: this has to be registered BEFORE the
         dev server's HMR client, which it cannot be from the module entry.
         Bun injects its client script into the head, so a listener installed
         from `main.tsx` is registered second — and the `error` event is
         dispatched AT `window`, where listeners run in REGISTRATION order, not
         capture-then-bubble. Measured here: the dev client's listener at t=272ms
         and the module's at t=307ms, so `stopImmediatePropagation` from the
         module arrived after the overlay had already been fed.

         The message is the browser reporting that its per-frame ResizeObserver
         delivery depth ran out with a notification still pending — a layout
         timing warning, not an exception anything threw. Chrome and Firefox
         raise it through `error`, so Bun's client draws its full-screen "Runtime
         Error" overlay (z-index 2147483647) over the whole app for it and counts
         it (`1 of 667 Errors`). The Kabmo's own resize-driven auto-scroll no
         longer provokes it (the timeline defers its pin out of the delivery, see
         `hooks/chat/timeline/scroll.ts`), but observers the app does not own can
         still report it and it is never actionable.

         `stopImmediatePropagation`, not `preventDefault`: the dev client's
         listener runs first and is not cancelable, so the dispatch has to be
         stopped, not the default. Matched exactly, so every other error still
         reaches the overlay — that is the whole point of having one. -->
    <script>
      (function () {
        var RESIZE_OBSERVER_LOOP = 'ResizeObserver loop completed with undelivered notifications.';
        window.addEventListener('error', function (event) {
          if (event.message === RESIZE_OBSERVER_LOOP) event.stopImmediatePropagation();
        }, true);
      })();
    </script>
    <!-- Relative, not absolute: Bun's HTML loader resolves every local `href`
         against this file and emits a content-hashed copy, so `./public/icon.svg`
         becomes `/icon-<hash>.svg`. An absolute `/icon.svg` is read as a module
         specifier and fails the whole build with "Could not resolve". The
         manifest's OWN icon entries stay absolute — Bun does not rewrite inside
         a copied JSON file, and `public/` is served directly, so `/icon.svg`
         resolves there. -->
    <link rel="manifest" href="./public/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./public/icon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="./public/icon-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />
    <!-- No webfont from a third party. This block used to load Inter from
         `fonts.googleapis.com` — a render-blocking request in `<head>` for a
         family no stylesheet in the app ever named, so the browser paid a
         round-trip to a third party and drew nothing with it. The UI stack is
         the system face (`tailwind.css` → `body`), and the mono face is bundled
         by `scripts/build-client.ts`. A page that ships an external font must
         name it somewhere; this one did not. -->
    <!--app-head-->
  </head>
  <body>
    <div id="app"></div>
    <!--app-bootstrap-->
    <!-- The client entry. rsbuild injected this tag into its own output; Bun's
         HTML loader takes it from the source, which is why the file is now a
         bundler entry rather than only a template the server reads. -->
    <script type="module" src="./src/client/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
