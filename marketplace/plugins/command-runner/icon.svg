<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Runner">
  <title>Runner</title>
  <!-- Geometry follows the built-in views' convention (Lucide): the art is inset
       2/24 of the box and strokes at 2/24, so a plugin's mark carries the same
       ink weight as the icons it sits beside. Paint is `currentColor`: the host
       draws a vector mark through a CSS mask, so the file supplies the shape and
       the surrounding ink supplies the colour.

       The shape is Lucide's `square-play`, and the choice is deliberate: the
       panel lists commands and RUNS one, and the first draft drew a shell prompt
       (a chevron over a line) — which is exactly the `terminal` view's own mark,
       so two buttons in the same activity bar carried the same glyph. A framed
       play button says "start this" and collides with nothing. -->
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2" />
    <path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z" />
  </g>
</svg>
